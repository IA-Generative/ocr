[project]
name = "ocr-evaluation"
version = "0.1.0"
description = "Model evaluation harness for OCR API, driven by HuggingFace datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.2.0",
    "jiwer>=4.0.0",
    "pillow>=13.0.0",
    "psutil>=7.0.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.2",
    "ocr-sdk",
    "codecarbon>=3.3.2",
    "pymupdf>=2.1",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
# Local models; each one pulls heavy runtimes, so they are opt-in: `uv sync --extra paddle`
paddle = ["paddleocr>=3.7.0", "onnxruntime>=1.20.0"]
# Also needs the tesseract binary and its language data (apt: tesseract-ocr tesseract-ocr-fra)
tesseract = ["pytesseract>=0.3.13"]

[project.scripts]
ocr-eval = "ocr_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_eval"]

[tool.uv.sources]
ocr-sdk = { path = "../sdk/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
