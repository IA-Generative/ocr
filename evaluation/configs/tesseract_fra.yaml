# Tesseract 5, French only (`lang: fra+eng` adds English). Up to 1000 samples per dataset so the latency
# percentiles (p90 / p95 / p99) mean something. CI runs this file; locally:
#   uv sync --extra tesseract
#   uv run ocr-eval run configs/tesseract_fra.yaml --max-samples 20
name: tesseract-fra
task: ocr
ci: true                           # run by .github/workflows/evaluation.yml

model:
  type: tesseract
  lang: fra          # fra+eng for French and English
  psm: 3             # 3 = auto page layout (forms, PDF pages); 7 would suit single-line datasets
  oem: 1             # LSTM engine
  threads: 1

datasets:
  - name: nielsr/funsd-layoutlmv3
    adapter: funsd
    split: test
    max_samples: 1000                # the test split only has 50 documents: capped there
  - name: Teklia/RIMES-2011-line
    adapter: rimes
    split: validation                # 1138 lines (test has 778, below 1000)
    max_samples: 1000
  - name: lightonai/fc-amf-ocr       # financial filings (PDF); reference = docTR output, not human
    adapter: fc_amf
    split: train
    streaming: true                  # 440 GB: never downloaded in full
    shuffle_buffer: 50
    pages_per_document: 1
    max_samples: 1000                # pages

# No thresholds yet: this run is the baseline to set them from.

profiling:
  codecarbon: true
  country_iso_code: FRA

hardware:
  label: null
