include:
  - project: $CATALOG_PATH
    file:
      - vault-ci.yml
      - kaniko-ci.yml
      # Temporarily unused: `helm-package-push` below inlines a fixed copy of
      # `.helm:build-push` while the fix is validated here before being proposed
      # upstream. Restore the `extends` once the catalogue carries it.
      - helm-ci.yml
    ref: main

default:
  image: alpine:latest

variables:
  TAG: "${CI_COMMIT_REF_SLUG}"
  REGISTRY_URL: "${REGISTRY_HOST}/${PROJECT_PATH}"
  # The chart lives at the repository root (helm/Chart.yaml), not nested under a
  # charts/ parent - so CHARTS_DIR is "." (one level up from the chart itself),
  # same convention as CHARTS_DIR: ./charts pointing at charts/<name>/Chart.yaml
  # elsewhere.
  CHARTS_DIR: .

stages:
  - read-secret
  - docker-build
  - helm-package

read_secret:
  stage: read-secret
  extends:
    - .vault:read_secret

docker-build-ocr-api:
  stage: docker-build
  extends:
    - .kaniko:build-push
  variables:
    DOCKERFILE: "apps/server/ocr_backend/Dockerfile"
    WORKING_DIR: "."
    IMAGE_NAMES: ""  # Overridden in before_script
    EXTRA_BUILD_ARGS: "--build-arg DOCKERHUB_MIRROR_URL=${DOCKERHUB_MIRROR_URL}"
  rules:
    - when: always
  before_script:
    - |
      SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      # The DSO mirror only ever syncs branches, never tags (see dso-auto-sync.yaml),
      # so this pipeline never runs as a GitLab tag pipeline and $CI_COMMIT_TAG is
      # always empty here. appVersion is the app version bump/release-please already
      # committed to Chart.yaml before the sync ran - same source of truth
      # helm-package-push below reads for the chart's own version.
      APP_VERSION=$(grep '^appVersion:' helm/Chart.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$APP_VERSION" ]; then
        echo "Error: Could not extract appVersion from helm/Chart.yaml"
        exit 1
      fi
      TAGS="ocr-api:$SHORT_SHA"
      TAGS="$TAGS ocr-api:$CI_COMMIT_REF_SLUG"
      # Environments deploy the version tag (pulled with pullPolicy Always), so only
      # the branches releases are cut from may write it: a pipeline on any other
      # branch would replace a released image with unreleased code.
      if [ "$CI_COMMIT_BRANCH" = "dev" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TAGS="$TAGS ocr-api:$APP_VERSION"
        if echo "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="$TAGS ocr-api:latest"
        fi
      fi
      export IMAGE_NAMES="$TAGS"
      echo "Building with tags: $IMAGE_NAMES"

