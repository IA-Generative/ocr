apiVersion: v2
name: ocr
type: application
version: 0.3.2
appVersion: "0.21.1"
description: A Helm chart to deploy ocr.
# home: https://this-is-tobi.com
deprecated: false
annotations: {}
keywords: []
dependencies:
  - name: redis
    alias: redis
    version: 0.27.9
    repository: oci://registry-1.docker.io/cloudpirates
    condition: redis.enabled
  - name: postgres
    alias: postgres
    version: 0.19.6
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: rustfs
    alias: rustfs
    version: 0.10.0
    repository: oci://registry-1.docker.io/cloudpirates
    condition: rustfs.enabled
  - name: cluster
    alias: cnpg
    version: 0.8.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg.enabled
sources:
  - https://github.com/IA-Generative/ocr
maintainers: []
