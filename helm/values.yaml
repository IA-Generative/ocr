  # -- Additional volumeClaims to add, concatenated with `volumeClaims` above at render time.
  # @section -- Worker
  extraVolumeClaims: []
  # -- List of mounts to add (normally used with `volumes` or `volumeClaims`).
  # @section -- Worker
  volumeMounts:
  - name: celeryconfig
    mountPath: /app/celeryconfig.py
    subPath: celeryconfig.py
  - mountPath: /app/.cache/
    name: cache
  - mountPath: /app/.tmp/
    name: tmp
  - mountPath: /tmp/
    name: run-tmp
  # - name: config-volume
