    #   ports:
    #   - protocol: TCP
    #     port: 32000
    #     endPort: 32768
  metrics:
    # -- Deploy metrics service.
    # @section -- Frontend
    enabled: false
    service:
      # -- Metrics service annotations.
      # @section -- Frontend
      annotations: {}
      # -- Metrics service labels.
      # @section -- Frontend
      labels: {}
      # -- Metrics service port name.
      # @section -- Frontend
      portName: "metrics"
      # -- Metrics service port.
      # @section -- Frontend
      port: 9000
      # -- Metrics service target port.
      # @section -- Frontend
      targetPort: 9000
    serviceMonitor:
      # -- Enable a prometheus ServiceMonitor.
      # @section -- Frontend
      enabled: false
      # -- Prometheus ServiceMonitor labels.
      # @section -- Frontend
      labels: {}
      # -- Prometheus ServiceMonitor annotations.
      # @section -- Frontend
      annotations: {}
      endpoints:
