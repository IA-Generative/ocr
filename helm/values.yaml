#     fsGroup: 10001
#     seccompProfile:
#       type: "RuntimeDefault"
#   securityContext:
#     runAsUser: 10001
#     allowPrivilegeEscalation: false
#     capabilities:
#       drop: ["ALL"]
#     runAsNonRoot: true
#     seccompProfile:
#       type: "RuntimeDefault"
#   command:
#   - "/bin/sh"
#   - "-c"
#   args:
#   - "echo archiving"
#   envFrom:
#   - secretRef:
#       name: "ocr"
#   resources:
#     requests:
#       cpu: "50m"
#       memory: "64Mi"
#     limits:
#       cpu: "100m"
#       memory: "128Mi"

# -- Map of extra specs to dynamically add to this chart. Each key is a unique, arbitrary name
# for the object (only used so `-f` values files/overrides can add, override or remove a single
# entry by key instead of the whole list - lists don't merge across values files in Helm). Each
# entry must be written as a YAML literal block scalar string (see the commented
# `my-configmap`/`my-vault-secret` examples below for the exact syntax), not a nested map: only
# the string form is passed through `tpl` as raw text, so multi-line substitutions (`nindent`,
# `include "helper.labels"`, ...) render correctly; a nested map form only round-trips safely for
# single-scalar substitutions like `{{ .Values.fullnameOverride }}`.
# @section -- General
extraObjects: {}
# my-configmap:
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: my-configmap
#   data:
#     key: test
# my-vault-secret:
#   apiVersion: secrets.hashicorp.com/v1beta1
#   kind: VaultStaticSecret
#   metadata:
#     name: foo
#     labels:
#       foo/bar: "baz"
#     annotations:
#       foo/bar: "baz"
#   spec:
#     mount: "my-kv"
#     vaultAuthRef: "my-vault-auth"
#     path: "dev/foo"
#     version: 21
#     type: "kv-v2"
#     refreshAfter: "30s"
#     hmacSecretData: true
#     rolloutRestartTargets:
#     - kind: Deployment
#       name: api
#     destination:
#       create: true
#       overwrite: true
#       labels:
#         foo/bar: "baz"
#       annotations:
#         foo/bar: "baz"
#       name: foo
#       type: "Opaque"

# Cloudpirates' simple standalone PostgreSQL instance (mutually exclusive with `cnpg` below -
# only enable one). This is the DEFAULT database backend: enabled out of the box, single
# instance, no extra operator required, so the chart works with `helm install` and no
# configuration at all. `api.env`/`worker.env`/`jobs.migration.env` (below) get a `DATABASE_URL`
# pointing at it by default. For production, install the CloudNativePG operator, set
# `postgres.enabled: false` and `cnpg.enabled: true` (see `cnpg` below) instead for a proper
# HA/backed-up cluster, and repoint `DATABASE_URL` (or unset it, e.g. `null`, if you inject it
# another way - such as via a Vault secret through `envFrom` - since an explicit `env` entry
# otherwise takes precedence over `envFrom` on a name collision) at CNPG's own generated
# credentials/secret instead.
postgres:
  # -- Deploy the bundled postgres subchart.
  # @section -- Postgres
  enabled: true
  # -- Override the name used for postgres resources.
  # @section -- Postgres
  fullnameOverride: "ocr-postgres"
  auth:
    # -- Password for the auto-created postgres superuser. Leave empty (default) to auto-generate a
    # random password on first install (plug-and-play) - the chart-generated "<fullnameOverride>"
    # Secret's `uri` key (consumed by `api.env.DATABASE_URL`/`worker.env.DATABASE_URL` below) is
    # built from it either way.
    # @section -- Postgres
    password: ""
    # -- Name of a pre-existing secret to use instead of the one above (e.g. Vault-managed). Must be
    # named identically to `fullnameOverride` above and already contain the keys the chart would
    # otherwise generate (`uri`, `postgres-password`, `host`, `port`, `username`, `database`) - when
    # set, the chart generates no Secret of its own (same pattern as `redis.auth.existingSecret`
    # below).
    # @section -- Postgres
    existingSecret: ""
  persistence:
    # -- Size of the PersistentVolumeClaim for PostgreSQL data.
    # @section -- Postgres
    size: "5Gi"
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"
  # The subchart's own statefulset already mounts unconditional emptyDirs for `run`
  # (`postgres.runDir`, its unix socket) and `/tmp` alongside the PVC-backed data dir, so
  # `readOnlyRootFilesystem: true` needs nothing extra from us here - unlike the frontend chart's
  # nginx container, where those emptyDirs had to be added (see `frontend.extraVolumes` above).
  containerSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  resources:
    requests:
      # -- CPU request for the PostgreSQL container.
      # @section -- Postgres
      cpu: "50m"
      # -- Memory request for the PostgreSQL container.
      # @section -- Postgres
      memory: "128Mi"
    limits:
      # -- CPU limit for the PostgreSQL container.
      # @section -- Postgres
      cpu: "250m"
      # -- Memory limit for the PostgreSQL container.
      # @section -- Postgres
      memory: "512Mi"

cnpg:
  # -- Enable the bundled CNPG PostgreSQL cluster (requires the CloudNativePG operator to be
  # installed in the cluster). This is the production-grade database path (HA, backups) -
  # mutually exclusive with `postgres` above: when enabling this, set `postgres.enabled: false`
  # and repoint (or unset) `DATABASE_URL` at CNPG's own credentials/secret instead.
  # @section -- Cnpg
  enabled: false

# Cloudpirates' redis chart provides the queue/broker Celery relies on. Enabled out of the box
# in "replication" architecture with a single replica and Sentinel disabled, so the chart deploys
# plug-and-play with minimal resources and no extra operator/CRDs required (same reasoning as
# `postgres` above). Architecture is kept as "replication" (rather than "standalone") even with a
# single replica purely so the exposed Service name/address stays identical whether or not
# Sentinel/extra replicas are later enabled for production - see `sentinel.enabled` below.
redis:
  # -- Deploy the bundled redis subchart.
  # @section -- Redis
  enabled: true
  # -- Override the name used for redis resources.
  # @section -- Redis
  fullnameOverride: "ocr-redis"
  # -- Redis architecture (`standalone` or `replication`). Kept as `replication` even with a
  # single replica/no Sentinel below, purely so the exposed Service name/address stays identical
  # whether or not Sentinel/extra replicas are later enabled for production (see note above).
  # @section -- Redis
  architecture: "replication"
  # -- Number of Redis instances to deploy (1 master + N-1 replicas when `architecture` is
  # `replication`). Kept at `1` (master only, no replicas) by default for a plug-and-play
  # install; raise this for production HA.
  # @section -- Redis
  replicaCount: 1
  auth:
    # -- Enable Redis password authentication (secure by default).
    # @section -- Redis
    enabled: true
    # -- Enable Sentinel authentication (only relevant when `sentinel.enabled` below is `true`). In
    # this chart's non-ACL auth mode there is only one real password - when enabled, the Sentinel
    # process's own `requirepass` is set from this same `password`/`existingSecret` too (there is no
    # separate value/key for a distinct Sentinel-only password).
    # @section -- Redis
    sentinel: true
    # -- Redis password. Leave empty (default) to auto-generate a random password on first install
    # (plug-and-play) - the chart-generated "<fullnameOverride>" Secret's `redis-password` key (see
    # `existingSecretPasswordKey` below) is set from it either way.
    # @section -- Redis
    password: ""
    # -- Name of a pre-existing secret to use instead of the one above (e.g. Vault-managed). Must be
    # named identically to `fullnameOverride` above and already contain the key named by
    # `existingSecretPasswordKey` below - when set, the chart generates no Secret of its own (same
    # pattern as `postgres.auth.existingSecret` above).
    # @section -- Redis
    existingSecret: ""
    # -- Key inside `existingSecret` (or the chart-generated secret) holding the Redis password.
    # @section -- Redis
    existingSecretPasswordKey: "redis-password"
  # This chart only has ONE real password in non-ACL mode: when `sentinel.enabled` above is `true`,
  # the Sentinel process's own `requirepass` falls back to this same `existingSecretPasswordKey`
  # too (there is no separate key for a distinct Sentinel-only password) - so if your app treats
  # data-node auth and sentinel-port auth as two separate settings (e.g. REDIS_PASSWORD vs.
  # REDIS_SENTINEL_PASSWORD), both must hold the identical value in `existingSecret`.
  persistence:
    # -- Enable a PersistentVolumeClaim for Redis data.
    # @section -- Redis
    enabled: true
    # -- Size of the PersistentVolumeClaim for Redis data.
    # @section -- Redis
    size: "5Gi"
  # This default (50m/100m, 128Mi/256Mi) is a plug-and-play minimum sized for a demo install, not a
  # real broker: raise it for production, where Redis is the Celery broker for a KEDA-scaled worker
  # fleet plus the Sentinel quorum's health traffic. Too low and the single-threaded Redis gets
  # CPU-throttled under BRPOP/pub-sub load, and too little memory with no eviction (`noeviction` is
  # correct for a broker - queued tasks must never be dropped) risks an OOM-kill under a task
  # backlog. Either shows up to the worker as `redis.exceptions.ConnectionError: Connection closed
  # by server` / "broker lost". Don't set `maxmemory` - give headroom via the pod limit instead.
  resources:
    requests:
      # -- CPU request for the Redis container.
      # @section -- Redis
      cpu: "50m"
      # -- Memory request for the Redis container.
      # @section -- Redis
      memory: "128Mi"
    limits:
      # -- CPU limit for the Redis container.
      # @section -- Redis
      cpu: "100m"
      # -- Memory limit for the Redis container.
      # @section -- Redis
      memory: "256Mi"
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"
  # readOnlyRootFilesystem is left unset here: the subchart's own default is already `true`.
  containerSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  initContainer:
    resources:
      requests:
        # -- CPU request for the volume-permissions init container.
        # @section -- Redis
        cpu: "25m"
        # -- Memory request for the volume-permissions init container.
        # @section -- Redis
        memory: "64Mi"
      limits:
        # -- CPU limit for the volume-permissions init container.
        # @section -- Redis
        cpu: "25m"
        # -- Memory limit for the volume-permissions init container.
        # @section -- Redis
        memory: "64Mi"
  sentinel:
    # -- Enable Sentinel for automatic master failover. Disabled by default (single replica, see
    # `replicaCount` above); turn on together with a higher `replicaCount` for production HA. The
    # KEDA ScaledObject trigger (`worker.kedaAutoscaler.redis.address`) only supports a single
    # plain address, not native sentinel discovery - `masterService.enabled` below keeps exposing
    # a stable "<fullnameOverride>-master" Service either way, so flipping this doesn't require
    # any other change.
    # @section -- Redis
    enabled: false
    # -- Name Sentinel uses to identify the monitored master group.
    # @section -- Redis
    masterName: "ocr-redis"
    masterService:
      # -- When Sentinel is enabled, keep exposing a stable "<fullnameOverride>-master" Service
      # (same name/behavior as without Sentinel) via a small chart-managed discovery Deployment
      # that dynamically repoints it at whichever pod Sentinel currently elected as master.
      # @section -- Redis
      enabled: false
      # -- Interval (in seconds) at which the master-service discovery Deployment checks Sentinel
      # for the current master.
      # @section -- Redis
      checkInterval: 30
    # -- Minimum number of Sentinels that must agree the master is down before triggering failover.
    # @section -- Redis
    quorum: 2
    # -- Milliseconds after which the master is considered down if unreachable.
    # @section -- Redis
    downAfterMilliseconds: 5000
    # -- Milliseconds to wait before considering a failover attempt failed.
    # @section -- Redis
    failoverTimeout: 60000
    # -- Number of replicas Sentinel resyncs from the new master simultaneously during a failover.
    # @section -- Redis
    parallelSyncs: 1
    resources:
      requests:
        # -- CPU request for the Sentinel container.
        # @section -- Redis
        cpu: "50m"
        # -- Memory request for the Sentinel container.
        # @section -- Redis
        memory: "128Mi"
      limits:
        # -- CPU limit for the Sentinel container.
        # @section -- Redis
        cpu: "100m"
        # -- Memory limit for the Sentinel container.
        # @section -- Redis
        memory: "256Mi"

# CloudPirates' RustFS chart (S3-compatible object storage, alpha) provides the file storage
# `api`/`worker` need. Enabled out of the box with a single replica and an auto-generated key
# pair, same reasoning as `postgres`/`redis` above - no extra operator/CRDs required, plug-and-play
# with `helm install` and no configuration at all. `api.env`/`worker.env` (below) get
# `AWS_ENDPOINT_URL`/`AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY` pointing at it by default. For
# production, either disable this (`rustfs.enabled: false`) and point the same env vars at a real
# S3 provider, or override `rustfs.auth.existingSecret` below to inject your own credentials
# (e.g. via a Vault secret) into this same bundled instance instead.
rustfs:
  # -- Deploy the bundled RustFS subchart.
  # @section -- Rustfs
  enabled: true
  # -- Override the name used for RustFS resources.
  # @section -- Rustfs
  fullnameOverride: "ocr-rustfs"
  auth:
    # -- RustFS access key (not secret-backed - unlike `secretKey` below, this is a plain value).
    # @section -- Rustfs
    accessKey: "rustfsadmin"
    # -- RustFS secret key. Leave empty (default) to auto-generate a random one on first install
    # (plug-and-play) - the chart-generated "<fullnameOverride>" Secret's `secret-key` key (see
    # `existingSecretSecretKeyKey` below) is set from it either way.
    # @section -- Rustfs
    secretKey: ""
    # -- Name of a pre-existing secret to use instead of the one above (e.g. Vault-managed). Must be
    # named identically to `fullnameOverride` above and already contain the keys named by
    # `existingSecretAccessKeyKey`/`existingSecretSecretKeyKey` below - when set, the chart
    # generates no Secret of its own (same pattern as `redis.auth.existingSecret` above). Unlike
    # postgres/redis (single password), RustFS needs an access/secret key *pair* - both keys live in
    # the same secret.
    # @section -- Rustfs
    existingSecret: ""
    # -- Key inside `existingSecret` (or the chart-generated secret) holding the access key.
    # @section -- Rustfs
    existingSecretAccessKeyKey: "access-key"
    # -- Key inside `existingSecret` (or the chart-generated secret) holding the secret key.
    # @section -- Rustfs
    existingSecretSecretKeyKey: "secret-key"
  dataPersistence:
    # -- Size of the PersistentVolumeClaim for RustFS data.
    # @section -- Rustfs
    size: "5Gi"
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"
  # The subchart's own deployment already mounts an unconditional `/tmp` emptyDir alongside the
  # PVC-backed data/logs dirs, so `readOnlyRootFilesystem: true` needs nothing extra from us here.
  containerSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  resources:
    requests:
      # -- CPU request for the RustFS container.
      # @section -- Rustfs
      cpu: "50m"
      # -- Memory request for the RustFS container.
      # @section -- Rustfs
      memory: "128Mi"
    limits:
      # -- CPU limit for the RustFS container.
      # @section -- Rustfs
      cpu: "250m"
      # -- Memory limit for the RustFS container.
      # @section -- Rustfs
      memory: "512Mi"
