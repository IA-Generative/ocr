  serviceAccount:
    # -- Enable the service account.
    # @section -- Worker
    enabled: false
    # -- Create a service account.
    # @section -- Worker
    create: false
    # -- Annotations applied to created service account.
    # @section -- Worker
    annotations: {}
    # -- Service account name.
    # @section -- Worker
    name: ""
    # -- Should the service account access token be automount in the pod.
    # @section -- Worker
    automountServiceAccountToken: false
    role:
      # -- Should the role be created.
      # @section -- Worker
      create: false
      # -- Role rules associated with the service account.
      # @section -- Worker
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Worker
      create: false
      # -- ClusterRole rules associated with the service account.
      # @section -- Worker
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a PodDisruptionBudget for the app
    # @section -- Worker
    enabled: false
    # -- Labels to be added to app pdb.
    # @section -- Worker
    labels: {}
    # -- Annotations to be added to app pdb.
    # @section -- Worker
    annotations: {}
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%).
    # @section -- Worker
    # @default -- `""` (defaults to 0 if not specified)
    minAvailable: ""
    # -- Number of pods that are unavailable after eviction as number or percentage (eg.: 50%). Has higher precedence over `worker.pdb.minAvailable`.
    # @section -- Worker
    maxUnavailable: ""
  networkPolicy:
    # -- Create NetworkPolicy object for the app.
    # @section -- Worker
    create: false
    # -- Policy types used in the NetworkPolicy object.
    # @section -- Worker
    policyTypes:
      - Ingress
    # -- Ingress rules for the NetworkPolicy object.
    # @section -- Worker
    ingress: []
    # - from:
    #   - ipBlock:
    #       cidr: 172.17.0.0/16
    #       except:
    #       - 172.17.1.0/24
    #   - namespaceSelector:
    #       matchLabels:
    #         project: myproject
    #   - podSelector:
    #       matchLabels:
    #         role: frontend
    #   ports:
    #   - protocol: TCP
    #     port: 6379
    # -- Egress rules for the NetworkPolicy object.
    # @section -- Worker
    egress: []
    # - to:
    #   - ipBlock:
    #       cidr: 10.0.0.0/24
    #   ports:
    #   - protocol: TCP
    #     port: 32000
    #     endPort: 32768
  metrics:
    # -- Deploy metrics service.
    # @section -- Worker
    enabled: false
    service:
      # -- Metrics service annotations.
      # @section -- Worker
      annotations: {}
      # -- Metrics service labels.
      # @section -- Worker
      labels: {}
      # -- Metrics service port name.
      # @section -- Worker
      portName: "metrics"
      # -- Metrics service port.
      # @section -- Worker
      port: 9000
      # -- Metrics service target port.
      # @section -- Worker
      targetPort: 9000
    serviceMonitor:
      # -- Enable a prometheus ServiceMonitor.
      # @section -- Worker
      enabled: false
      # -- Prometheus ServiceMonitor labels.
      # @section -- Worker
      labels: {}
      # -- Prometheus ServiceMonitor annotations.
      # @section -- Worker
      annotations: {}
      endpoints:
      - basicAuth:
          # -- The secret in the service monitor namespace that contains the username for authentication.
          # @section -- Worker
          username: ""
          # -- The secret in the service monitor namespace that contains the password for authentication.
          # @section -- Worker
          password: ""
        bearerTokenSecret:
          # -- Secret name to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
          # @section -- Worker
          name: ""
