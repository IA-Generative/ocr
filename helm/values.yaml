          selector: {}
          # prometheus: kube-prometheus
          # -- Prometheus ServiceMonitor scheme.
          # @section -- Frontend
          scheme: ""
          # -- Prometheus ServiceMonitor tlsConfig.
          # @section -- Frontend
          tlsConfig: {}

worker:
  # -- Workload kind to deploy the app as. One of "Deployment" or "StatefulSet".
  # @section -- Worker
  deploymentType: "Deployment"
  # -- The number of application controller pods to run. Kept at `1` by default so the chart
  # deploys plug-and-play with minimal resources; bump this (and/or enable `worker.kedaAutoscaler`)
  # for production.
  # @section -- Worker
  replicaCount: 1
  # -- Grace period k8s gives the worker to shut down before SIGKILL. OCR tasks run for minutes, so the
  # 30s k8s default would SIGKILL the pod mid-task on every rollout / KEDA scale-down. Raised so Celery's
  # warm shutdown can finish the in-flight task first; anything still running past this window is caught
  # by `task_acks_late` (see `celeryConfig`) and redelivered/resumed. Keep it below the KEDA
  # `cooldownPeriod` horizon and rollout expectations so a stuck worker cannot block scale-down forever.
  # @section -- Worker
  terminationGracePeriodSeconds: 600
  image:
    # -- Registry to use for the app.
    # @section -- Worker
    registry: "ghcr.io"
    # -- Repository to use for the app.
    # @section -- Worker
    repository: "ia-generative/ocr/worker"
    # -- Image pull policy for the app.
    # @section -- Worker
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Worker
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Worker
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Worker
    className: ""
    # -- Additional ingress annotations.
    # @section -- Worker
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Worker
    labels: {}
    hosts:
    -  # -- Name of the host record.
      # @section -- Worker
      name: "domain.local"
      paths:
      -  # -- Path of the host record to manage routing.
        # @section -- Worker
        path: "/"
        # -- Path type of the host record.
        # @section -- Worker
        pathType: "Prefix"
        backend:
          # -- Name of the backend service linked to the path (leave empty to use the app service).
          # @section -- Worker
          serviceName: ""
          # -- Port used by the backend service linked to the path (leave null to use the app service port).
          # @section -- Worker
          portNumber: null
    # -- Enable TLS configuration.
    # @section -- Worker
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Gateway API HTTPRoute configuration (alternative to Ingress)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
  httpRoute:
    # -- Enable an HTTPRoute resource for this service.
    # @section -- Worker
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Worker
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Worker
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Worker
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace  # optional
    #   sectionName: https            # optional, specific listener name
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Worker
    hostnames: []
    # - "example.com"
    # - "api.example.com"
    # -- Routing rules for the HTTPRoute.
    # @section -- Worker
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix     # PathPrefix, Exact, or RegularExpression
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service       # defaults to chart service if not set
    #     port: 80               # defaults to service port if not set
    #     weight: 100            # for traffic splitting
  ## Gateway API GRPCRoute configuration (for gRPC services)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
  grpcRoute:
    # -- Enable a GRPCRoute resource for this service.
    # @section -- Worker
    enabled: false
    # -- Additional GRPCRoute annotations.
    # @section -- Worker
    annotations: {}
    # -- Additional GRPCRoute labels.
    # @section -- Worker
    labels: {}
    # -- Parent references (Gateways) to attach the GRPCRoute to.
    # @section -- Worker
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: grpc
    # -- Hostnames for the GRPCRoute to match.
    # @section -- Worker
    hostnames: []
    # - "grpc.example.com"
    # -- Routing rules for the GRPCRoute.
    # @section -- Worker
    rules: []
    # - matches:
    #   - method:
    #       type: Exact          # Exact or RegularExpression
    #       service: "mypackage.MyService"
    #       method: "MyMethod"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #   backendRefs:
    #   - name: my-grpc-service
    #     port: 50051
    #     weight: 100
  # -- Annotations for the app deployed pods.
  # @section -- Worker
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Worker
  podLabels: {}
  # -- Pod-level security context. Rendered via `toYaml`, so any other `PodSecurityContext` field
  # (e.g. `runAsGroup`, `sysctls`, `supplementalGroups`) can be added here too, even though not
  # pre-populated below.
  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  # -- Init containers to add to the app pod.
  # @section -- Worker
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Worker
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Worker container port number. Set to `null` since this component only consumes a
  # Celery queue and never accepts traffic (see `service.enabled` below).
  # @section -- Worker
  containerPort: &workerContainerPort ~
  # -- Worker container port name.
  # @section -- Worker
  containerPortName: "http"
  # -- Worker extra container ports.
  # @section -- Worker
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Worker container command.
  # @section -- Worker
  command:
  - "celery"
  - "--config"
  - "celeryconfig"
  - "-A"
  - "services.main"
  - "worker"
  - "-E"
  # -- Worker container command args.
  # @section -- Worker
  args: []
  # -- Container-level security context. Rendered via `toYaml`, so any other
  # `SecurityContext` field (e.g. `procMount`) can be added here too, even though
  # not pre-populated below.
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    seccompProfile:
      type: "RuntimeDefault"
  kedaAutoscaler:
    # -- Enable KEDA autoscaling.
    # @section -- Worker
    enabled: false
    # -- Minimum number of replicas.
    # @section -- Worker
    minReplicaCount: 1
    # -- Maximum number of replicas.
    # @section -- Worker
    maxReplicaCount: 10
    # -- Interval between trigger checks (in seconds).
    # @section -- Worker
    pollingInterval: 30
    # -- Cooldown period before scaling down (in seconds).
    # @section -- Worker
    cooldownPeriod: 300
    fallback:
      # -- Failure threshold to activate fallback.
      # @section -- Worker
      failureThreshold: 3
      # -- Number of replicas during fallback.
      # @section -- Worker
      replicas: 1
    behavior:
      scaleUp:
        # -- Stabilization window for scaling up (in seconds).
        # @section -- Worker
        stabilizationWindowSeconds: 30
      scaleDown:
        # -- Stabilization window for scaling down (in seconds).
        # @section -- Worker
        stabilizationWindowSeconds: 300
    redis:
      # -- Name of the KEDA `TriggerAuthentication` resource (created by this chart when
      # `redis.secretRef`/`redis.secretKey` below are set) that supplies Redis credentials to
      # the `ScaledObject`.
      # @section -- Worker
      authenticationRef: "ocr-worker"
      # -- Redis server address. Leave empty to use the default `redis.fullnameOverride`/`redis.service.port` from the bundled Redis chart.
      # @section -- Worker
      address: ""
      # -- Redis list name to monitor.
      # @section -- Worker
      listName: "celery"
      # -- Redis list target length.
      # @section -- Worker
      listLength: "5"
      # -- Redis password (optional).
      # @section -- Worker
      password: ""
      # -- Redis authentication secret name.
      # @section -- Worker
      secretRef: ""  # "{{ .Values.redis.fullnameOverride }}"
      # -- Redis authentication secret key.
      # @section -- Worker
      secretKey: ""  # "redis-password"
  # -- Worker container env variables loaded from configmap or secret reference. List or map
  # (merged with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
  # @section -- Worker
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Map or array of environment variables to inject into the app container (`valueFrom` supported).
  # @section -- Worker
  env:
    UV_CACHE_DIR: /app/.cache/
    # See the Sentinel/TLS wiring comment on `api.env.REDIS_HOST` above - identical contract here.
    REDIS_HOST: "ocr-redis-master"
    CELERY_APP_NAME: ocr
    # Required - `services/main.py` reads both via direct `os.environ[...]` (not `.get()`), so the
    # worker container crashes on startup with a Python KeyError if either is unset, before it even
    # attempts to connect to Redis/Postgres. PROCESS_NAME's actual value doesn't affect pipeline
    # construction (unused by `services/factory.py::load_worker` itself) but must be a non-empty
    # string. WORKER_NAME's value DOES matter: the api container sends tasks to a Celery queue
    # hardcoded as "worker.tasks.ocr" (`ocr_backend/routers/jobs.py`, not env-driven) - the worker
    # must register under that exact same name or it silently never picks up any task.
    PROCESS_NAME: "paddleocr-2.10.0"
    WORKER_NAME: "worker.tasks.ocr"
    # Points at the top-level `postgres` values (the bundled, default database backend). Switching
    # to `cnpg.enabled: true` for production requires overriding (or unsetting, e.g. `null`) this
    # to point at CNPG's own credentials/secret instead - see the top-level `postgres`/`cnpg`.
    DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: "ocr-postgres"
          key: "uri"
    # Points at the top-level `rustfs` values (the bundled, default S3-compatible storage - see
    # `rustfs` below). `AWS_BUCKET_NAME`/`VERIFY_SSL` are the only two fields `ocr-api`'s own
    # `S3Settings` actually declares (`apps/server/src/config/s3.py`, `origin/main`) - everything
    # else here is read directly by boto3's own env-var chain, not through pydantic, so there's no
    # crash risk even if unset. For production, either disable `rustfs` and point these at a real S3
    # provider, or repoint `AWS_SECRET_ACCESS_KEY` at your own Vault-managed secret instead (see
    # `rustfs.auth.existingSecret`).
    AWS_ENDPOINT_URL: "http://ocr-rustfs:9000"
    AWS_ACCESS_KEY_ID: "rustfsadmin"
    AWS_SECRET_ACCESS_KEY:
      valueFrom:
        secretKeyRef:
          name: "ocr-rustfs"
          key: "secret-key"
    AWS_BUCKET_NAME: "ocr"
    AWS_DEFAULT_REGION: "us-east-1"
    VERIFY_SSL: "False"
    # Logging identity + noise suppression. SERVICE_NAME/COMPONENT: see `api.env` above (same
    # convention, "ocr_worker"/"worker" here). The HF/TQDM/GLOG vars stop huggingface_hub / tqdm
    # progress bars and Paddle C++ chatter from being printed straight to stdout/stderr (bypassing
    # the JSON logger) - the single biggest source of unparseable worker log lines otherwise.
    SERVICE_NAME: "ocr_worker"
    COMPONENT: "worker"
    HF_HUB_DISABLE_PROGRESS_BARS: "1"
    TQDM_DISABLE: "1"
    GLOG_minloglevel: "2"
    SEND_DEFAULT_PII: "False"
    # Read by `PaddleSetting.DEVICE` (business/paddleocr2/configs/paddle.py) to select the
    # inference device; defaults to "cpu" when unset. To actually run on GPU, the image itself
    # must also be built with `--build-arg PADDLE_DEVICE=gpu` (apps/server/business/paddleocr2/
    # Dockerfile) so the CUDA-enabled PaddlePaddle wheel is installed - then set this to "gpu"
    # and request `nvidia.com/gpu` below.
    # DEVICE: "gpu"
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by the app container (`valueFrom` not supported).
  # @section -- Worker
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by the app container (`valueFrom` not supported).
  # @section -- Worker
  envSecret: {}
  # E: "E"
  # -- Celery configuration for the worker container, rendered as-is into the
  # `templates/worker/celeryconfig.yaml` ConfigMap (mounted as `celeryconfig.py`, see
  # `volumes`/`volumeMounts` below) and genuinely loaded: `command` below passes
  # `--config celeryconfig` to the `celery` CLI, which reads this module (verified against Celery
  # 5.6.3's own CLI reference - `--config` is still a valid global option, positioned before the
  # `worker` subcommand per Celery 5.x's CLI convention). The equivalent `api.celeryConfig` was
  # removed: the api container never invokes the `celery` CLI (its entrypoint is a plain uvicorn
  # server, see `ocr-api`'s `scripts/run.sh`) and nothing in the app reads `CELERY_CONFIG_MODULE`
  # either, so that ConfigMap/mount were pure dead weight there.
  # @section -- Worker
  celeryConfig: |
    worker_concurrency = 1
    worker_pool = "solo"
    timezone = "Europe/Paris"
    broker_connection_retry_on_startup = True
    task_acks_late = True
    worker_prefetch_multiplier = 1
    worker_cancel_long_running_tasks_on_connection_loss = True
    worker_hijack_root_logger = False
  #   broker_connection_retry_on_startup            survive Redis Sentinel election churn after a deploy.
  #   task_acks_late + worker_prefetch_multiplier=1 at-least-once for long OCR tasks: a worker killed
  #     mid-task (routine on KEDA scale-down / OOM) redelivers and resumes from its per-page cache
  #     instead of silently losing the job; prefetch=1 keeps fleet distribution fair and KEDA's
  #     queue-length signal honest. CAVEAT: worker_pool=solo means Celery time limits are NOT enforced,
  #     so a poison-pill PDF could redeliver forever - bound it app-side (see reliability/logging doc).
  #   worker_cancel_long_running_tasks_on_connection_loss  Celery 6 default; cancel+redeliver on broker
  #     loss and silence the pending-deprecation warning.
  #   worker_hijack_root_logger=False               let the app's JSON logger own logging (logging doc).

  probes:
    # -- Worker startup probe. Empty by default: this component only consumes a Celery queue and
    # exposes no HTTP endpoint to probe (unlike `api`/`frontend`). Defined using `toYaml`, so any
    # Kubernetes probe (`httpGet`, `exec`, `tcpSocket`, ...) can be set here.
    # @section -- Worker
    startupProbe: {}
      # httpGet:
      #   # -- Worker container healthcheck endpoint (startupProbe is defined using `toYaml` so it is possible to override it completely).
      #   # @section -- Worker
      #   path: "/"
      #   # -- Port to use for healthcheck (defaults to container port).
      #   # @section -- Worker
      #   port: *workerContainerPort
      # # -- Number of seconds after the container has started before probe is initiated.
      # # @section -- Worker
      # initialDelaySeconds: 0
      # # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # # @section -- Worker
      # successThreshold: 1
      # # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # # @section -- Worker
      # failureThreshold: 10
      # # -- How often (in seconds) to perform the probe.
      # # @section -- Worker
      # periodSeconds: 10
      # # -- Number of seconds after which the probe times out.
      # # @section -- Worker
      # timeoutSeconds: 5
    # -- Worker readiness probe. Empty by default, same reasoning as `startupProbe` above.
    # @section -- Worker
    readinessProbe: {}
      # httpGet:
      #   # -- Worker container healthcheck endpoint (readinessProbe is defined using `toYaml` so it is possible to override it completely).
      #   # @section -- Worker
      #   path: "/"
      #   # -- Port to use for healthcheck (defaults to container port).
      #   # @section -- Worker
      #   port: *workerContainerPort
      # # -- Number of seconds after the container has started before probe is initiated.
      # # @section -- Worker
      # initialDelaySeconds: 10
      # # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # # @section -- Worker
      # successThreshold: 2
      # # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # # @section -- Worker
      # failureThreshold: 2
      # # -- How often (in seconds) to perform the probe.
      # # @section -- Worker
      # periodSeconds: 10
      # # -- Number of seconds after which the probe times out.
      # # @section -- Worker
      # timeoutSeconds: 5
    # -- Worker liveness probe. Empty by default, same reasoning as `startupProbe` above.
    # @section -- Worker
    livenessProbe: {}
      # httpGet:
      #   # -- Worker container healthcheck endpoint (livenessProbe is defined using `toYaml` so it is possible to override it completely).
      #   # @section -- Worker
      #   path: "/"
      #   # -- Port to use for healthcheck (defaults to container port).
      #   # @section -- Worker
      #   port: *workerContainerPort
      # # -- Number of seconds after the container has started before probe is initiated.
      # # @section -- Worker
      # initialDelaySeconds: 30
      # # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # # @section -- Worker
      # successThreshold: 1
      # # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # # @section -- Worker
      # failureThreshold: 3
      # # -- How often (in seconds) to perform the probe.
      # # @section -- Worker
      # periodSeconds: 30
      # # -- Number of seconds after which the probe times out.
      # # @section -- Worker
      # timeoutSeconds: 5
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # @section -- Worker
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Worker
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Worker
      maxSurge: 1
  # -- Image credentials configuration.
  # @section -- Worker
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
