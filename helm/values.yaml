## Gateway API configuration (alternative to Ingress)
## Ref: https://gateway-api.sigs.k8s.io/
gateway:
  # -- Create a Gateway resource. Usually, you reference an existing Gateway managed by the infrastructure team.
  # @section -- Global
  create: false
  # -- Name of the Gateway resource. If not set, uses the release fullname.
  # @section -- Global
  name: ""
  # -- GatewayClass name. Required when creating a Gateway.
  # @section -- Global
  className: ""
  # -- Additional gateway annotations.
  # @section -- Global
  annotations: {}
  # -- Additional gateway labels.
  # @section -- Global
  labels: {}
  # -- Gateway addresses configuration.
  # @section -- Global
  addresses: []
  # - type: IPAddress
  #   value: "192.168.1.100"
  # - type: Hostname
  #   value: "gateway.example.com"
  # -- Gateway listeners configuration.
  # @section -- Global
  listeners: []
  # - name: http
  #   port: 80
  #   protocol: HTTP
  #   hostname: "*.example.com"
  #   allowedRoutes:
  #     namespaces:
  #       from: Same  # Same, All, or Selector
  #     kinds:
  #     - kind: HTTPRoute
  # - name: https
  #   port: 443
  #   protocol: HTTPS
  #   hostname: "*.example.com"
  #   tls:
  #     mode: Terminate  # Terminate or Passthrough
  #     certificateRefs:
  #     - kind: Secret
  #       name: example-com-tls
  #   allowedRoutes:
  #     namespaces:
  #       from: Same

api:
  # -- Workload kind to deploy the app as. One of "Deployment" or "StatefulSet".
  # @section -- Api
  deploymentType: "Deployment"
  # -- The number of application controller pods to run. Kept at `1` by default so the chart
  # deploys plug-and-play with minimal resources; bump this (and/or enable `api.autoscaling`)
  # for production.
  # @section -- Api
  replicaCount: 1
  image:
    # -- Registry to use for the app.
    # @section -- Api
    registry: "ghcr.io"
    # -- Repository to use for the app.
    # @section -- Api
    repository: "ia-generative/ocr/api"
    # -- Image pull policy for the app.
    # @section -- Api
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Api
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Api
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Api
    className: ""
    # -- Additional ingress annotations.
    # @section -- Api
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Api
    labels: {}
    hosts:
    -  # -- Name of the host record.
      # @section -- Api
      name: "domain.local"
      paths:
      -  # -- Path of the host record to manage routing.
        # @section -- Api
        path: "/"
        # -- Path type of the host record.
        # @section -- Api
        pathType: "Prefix"
        backend:
          # -- Name of the backend service linked to the path (leave empty to use the app service).
          # @section -- Api
          serviceName: ""
          # -- Port used by the backend service linked to the path (leave null to use the app service port).
          # @section -- Api
          portNumber: null
    # -- Enable TLS configuration.
    # @section -- Api
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Gateway API HTTPRoute configuration (alternative to Ingress)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
  httpRoute:
    # -- Enable an HTTPRoute resource for this service.
    # @section -- Api
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Api
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Api
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Api
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace  # optional
    #   sectionName: https            # optional, specific listener name
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Api
    hostnames: []
    # - "example.com"
    # - "api.example.com"
    # -- Routing rules for the HTTPRoute.
    # @section -- Api
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix     # PathPrefix, Exact, or RegularExpression
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service       # defaults to chart service if not set
    #     port: 80               # defaults to service port if not set
    #     weight: 100            # for traffic splitting
  ## Gateway API GRPCRoute configuration (for gRPC services)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
  grpcRoute:
    # -- Enable a GRPCRoute resource for this service.
    # @section -- Api
    enabled: false
    # -- Additional GRPCRoute annotations.
    # @section -- Api
    annotations: {}
    # -- Additional GRPCRoute labels.
    # @section -- Api
    labels: {}
    # -- Parent references (Gateways) to attach the GRPCRoute to.
    # @section -- Api
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: grpc
    # -- Hostnames for the GRPCRoute to match.
    # @section -- Api
    hostnames: []
    # - "grpc.example.com"
    # -- Routing rules for the GRPCRoute.
    # @section -- Api
    rules: []
    # - matches:
    #   - method:
    #       type: Exact          # Exact or RegularExpression
    #       service: "mypackage.MyService"
    #       method: "MyMethod"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #   backendRefs:
    #   - name: my-grpc-service
    #     port: 50051
    #     weight: 100
  # -- Annotations for the app deployed pods.
  # @section -- Api
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Api
  podLabels: {}
  # -- Pod-level security context. Rendered via `toYaml`, so any other `PodSecurityContext` field
  # (e.g. `runAsGroup`, `sysctls`, `supplementalGroups`) can be added here too, even though not
  # pre-populated below.
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"
  # -- Init containers to add to the app pod.
  # @section -- Api
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Api
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Api container port number.
  # @section -- Api
  containerPort: &apiContainerPort 5000
  # -- Api container port name.
  # @section -- Api
  containerPortName: "http"
  # -- Api extra container ports.
  # @section -- Api
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Api container command.
  # @section -- Api
  command: []
  # -- Api container command args.
  # @section -- Api
  args: []
  # `runAsUser`/`runAsGroup` here - and `fsGroup` on `podSecurityContext` above, for every
  # component - are correct for a plain Kubernetes cluster but must be dropped on OpenShift:
  # its `restricted-v2` SCC allocates UIDs per namespace (`MustRunAsRange`) and rejects a pod
  # asking for one outside that range rather than overriding it. Leave `runAsNonRoot`,
  # `seccompProfile`, `drop: ["ALL"]` and `readOnlyRootFilesystem` in place there and let the
  # SCC assign the identity; the images own their files by group root precisely so that an
  # arbitrary assigned UID still works (see the `chown -R 10001:0` in each Dockerfile).
  # -- Container-level security context. Rendered via `toYaml`, so any other
  # `SecurityContext` field (e.g. `procMount`) can be added here too, even though
  # not pre-populated below.
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    seccompProfile:
      type: "RuntimeDefault"
  # -- Api container env variables loaded from configmap or secret reference. List or map (merged
  # with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
  # @section -- Api
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Map or array of environment variables to inject into the app container (`valueFrom` supported).
  # @section -- Api
  env:
    # This default (single Redis, no Sentinel) matches the bundled `redis` subchart's plug-and-play
    # config below. Real environments run `redis.architecture: replication` with Sentinel enabled,
    # which needs a different, larger set of env vars the app reads natively for HA discovery:
    #   REDIS_SENTINEL_ENABLED: "True"
    #   REDIS_SENTINEL_HOSTS: one "<redis fullname>-N.<redis fullname>-headless:26379" entry per
    #     Sentinel pod (NOT auto-derived from `redis.replicaCount` - update by hand if that changes)
    #   REDIS_SENTINEL_MASTER_NAME: the name Sentinel's `sentinel monitor <name> ...` uses, i.e.
    #     `redis.fullnameOverride` - NOT the "<fullname>-master" Service name
    # REDIS_HOST/REDIS_PORT below are ignored once Sentinel is on (kept only for the non-sentinel
    # fallback path; KEDA can't do sentinel discovery and always uses the stable "<fullname>-master"
    # Service instead - see `redis.sentinel.masterService`).
    # REDIS_USE_TLS must stay "False": the redis chart serves plaintext on 6379/26379
    # (`redis.tls.enabled` defaults to false) - setting it "True" both hangs the client against the
    # plaintext port AND flips the app's Celery broker to the "sentinels://" scheme, which isn't a
    # valid Kombu transport ("sentinel://" is the only valid one) - the worker then crash-loops on
    # "No such transport: sentinels".
    REDIS_HOST: "ocr-redis-master"
    CELERY_APP_NAME: ocr
    # Points at the top-level `postgres` values (the bundled, default database backend). Switching
    # to `cnpg.enabled: true` for production requires overriding (or unsetting, e.g. `null`) this
    # to point at CNPG's own credentials/secret instead - see the top-level `postgres`/`cnpg`.
    DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: "ocr-postgres"
          key: "uri"
    # Points at the top-level `rustfs` values (the bundled, default S3-compatible storage - see
    # `rustfs` below). `AWS_BUCKET_NAME`/`VERIFY_SSL` are the only two fields `ocr-api`'s own
    # `S3Settings` actually declares (`apps/server/src/config/s3.py`, `origin/main`) - everything
    # else here is read directly by boto3's own env-var chain, not through pydantic, so there's no
    # crash risk even if unset. For production, either disable `rustfs` and point these at a real S3
    # provider, or repoint `AWS_SECRET_ACCESS_KEY` at your own Vault-managed secret instead (see
    # `rustfs.auth.existingSecret`).
    AWS_ENDPOINT_URL: "http://ocr-rustfs:9000"
    AWS_ACCESS_KEY_ID: "rustfsadmin"
    AWS_SECRET_ACCESS_KEY:
      valueFrom:
        secretKeyRef:
          name: "ocr-rustfs"
          key: "secret-key"
    AWS_BUCKET_NAME: "ocr"
    AWS_DEFAULT_REGION: "us-east-1"
    VERIFY_SSL: "False"
    # Logging identity: SERVICE_NAME picks the logger name in the app's dictConfig (defaults to
    # "ocr_worker" for BOTH components, so without this override the API would log under the
    # worker's name); COMPONENT feeds the `component` log field.
    SERVICE_NAME: "ocr_api"
    COMPONENT: "api"
    # "keycloak" is already `ocr_backend`'s own code default (`VERIFY_TOKEN_MODEL` in
    # `ocr_backend/core/security/factory.py`) - set explicit here so it doesn't silently depend on
    # that code default. With this mode, the API only ever authenticates a request via the BFF
    # session cookie (see below) or an `API_KEYS` bearer token - never a Keycloak bearer token
    # directly, the browser doesn't hold one any more.
    VERIFY_TOKEN_MODEL: "keycloak"
    # PII scrubbing default for whichever Sentry DSN is wired via `envFrom` (see `SENTRY_API_DSN`/
    # `SENTRY_WORKER_DSN` in each real environment's Vault-managed secret).
    SEND_DEFAULT_PII: "False"
    # Backend-for-frontend Keycloak auth (`ocr_backend/routers/auth.py`): the browser never talks
    # to Keycloak or holds a token, only the backend does, via `/api/auth/{login,callback,logout,me}`
    # and an opaque `httpOnly` session cookie. None of these are set here - like the Sentry DSNs
    # above, they're per-environment and belong in that same Vault-managed secret wired via
    # `envFrom`, not hardcoded in this chart:
    #   KEYCLOAK_URL             - reached backend-to-Keycloak (token exchange/refresh/introspect/
    #                               logout). Usually the same public URL Keycloak is reachable at.
    #   KEYCLOAK_PUBLIC_URL      - optional, falls back to KEYCLOAK_URL. Only needs to differ if the
    #                               backend and the browser don't resolve Keycloak the same way (e.g.
    #                               local docker compose, where it's an internal service name for the
    #                               backend but a host-mapped port for the browser).
    #   KEYCLOAK_REALM / KEYCLOAK_CLIENT_ID
    #   KEYCLOAK_CLIENT_SECRET   - secret; the client MUST be confidential (not public), the backend
    #                              is the only party that ever exchanges an authorization code.
    #   BACKEND_PUBLIC_URL       - this API's own public URL, used to build the fixed
    #                              `{BACKEND_PUBLIC_URL}/api/auth/callback` redirect_uri - must
    #                              exactly match a redirect URI registered on the Keycloak client.
    #   FRONTEND_URL             - the SPA's public URL: CORS allow-origin (required - the session
    #                              cookie makes `allow_origins: ["*"]` a non-starter with
    #                              `allow_credentials: true`) and where `/callback` redirects after
    #                              login.
    # SESSION_COOKIE_SECURE/SESSION_COOKIE_SAMESITE default to "True"/"lax" in code
    # (`src/config/keycloak.py`), which is correct for this chart's HTTPS deployments - only
    # override for HTTP-only local dev (see the top-level `docker-compose.yaml`).
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by the app container (`valueFrom` not supported).
  # @section -- Api
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by the app container (`valueFrom` not supported).
  # @section -- Api
  envSecret: {}
  # E: "E"
  probes:
    startupProbe:
      httpGet:
        # -- Api container healthcheck endpoint (startupProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Api
        path: "/api/health"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Api
        port: *apiContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Api
      initialDelaySeconds: 15
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Api
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Api
      failureThreshold: 60
      # -- How often (in seconds) to perform the probe.
      # @section -- Api
      periodSeconds: 5
      # -- Number of seconds after which the probe times out.
      # @section -- Api
      timeoutSeconds: 1
    readinessProbe:
      httpGet:
        # -- Api container healthcheck endpoint (readinessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Api
        path: "/api/health"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Api
        port: *apiContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Api
      initialDelaySeconds: 15
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Api
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Api
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Api
      periodSeconds: 15
      # -- Number of seconds after which the probe times out.
      # @section -- Api
      timeoutSeconds: 1
    livenessProbe:
      httpGet:
        # -- Api container healthcheck endpoint (livenessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Api
        path: "/api/health"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Api
        port: *apiContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Api
      initialDelaySeconds: 15
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Api
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Api
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Api
      periodSeconds: 15
      # -- Number of seconds after which the probe times out.
      # @section -- Api
      timeoutSeconds: 1
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # @section -- Api
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Api
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Api
      maxSurge: 1
  # -- Image credentials configuration.
  # @section -- Api
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  # -- Host aliases that will be injected at pod-level into /etc/hosts.
  # @section -- Api
