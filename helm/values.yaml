# -- Master switch for the whole chart. When `false`, every template renders nothing (no api/
# frontend/worker/jobs/cronjobs/redis/postgres/cnpg/extraObjects at all) - use this to keep a
# release/namespace registered with a deployment system (e.g. an ArgoCD Application that always
# gets generated for every app/env combination) without actually deploying any resource into it.
# @section -- General
enabled: true
# -- Provide a name in place of the default application name.
# @section -- General
nameOverride: ""
# -- String to fully override the default application name.
# @section -- General
fullnameOverride: ""
# -- Add labels to all the deployed resources
# @section -- General
commonLabels: {}

global:
  # -- List or map of `configMapRef`/`secretRef` entries to load into every container's
  # `envFrom` (merged with each component's own `envFrom`, global entries first). Same scope
  # caveat as `env` below: only put entries here that truly ALL components need.
  # @section -- Global
  envFrom: []
  # - configMapRef:
  #     name: "my-config"
  # - secretRef:
  #     name: "my-secret"
  #
  # my-config:
  #   configMapRef:
  #     name: "my-config"
  # my-secret:
  #   secretRef:
  #     name: "my-secret"
  # -- Map or array of environment variables to inject into all containers (`valueFrom` supported).
  # Since this chart injects `global.env`/`global.envCm`/`global.envSecret` into EVERY component
  # (including `frontend`), only put values here that truly ALL components need. Anything
  # backend-specific (redis, celery, S3/AWS, etc.) belongs on the specific component's own
  # `env`/`envCm`/`envSecret` instead (see `api.env`/`worker.env`), so it isn't needlessly
  # exposed to components that don't use it (e.g. the static `frontend`).
  # @section -- Global
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by all containers (`valueFrom` not supported).
  # @section -- Global
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by all containers (`valueFrom` not supported).
  # @section -- Global
  envSecret: {}
  # E: "E"
  # `env`/`envCm`/`envSecret` (here and per-component) cover the common case: literal values
  # supplied straight from a values file. For anything that isn't a flat env var - a Secret/
  # ConfigMap populated by an external system (Vault, sealed-secrets, ...), a file mounted into
  # the pod, a CRD - don't add another dedicated key here: define the object directly under the
  # top-level `extraObjects` (see below) and reference it via `envFrom`/`volumes` instead. That
  # keeps this chart's own surface small while still covering those cases through one generic
  # mechanism instead of one bespoke key per use case.
  # -- Global Docker image registry.
  # @section -- Global
  imageRegistry: ""
  # -- Image credentials applied to every component in addition to any component-specific `imagePullSecrets`.
  # @section -- Global
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  # -- Globally shared ingress configuration.
  # @section -- Global
  ingress: {}
  # enabled: false
  # className: ""
  # annotations: {}
  # labels: {}
  # hosts:
  # - name: "domain.local"
  #   paths:
  #   - path: "/"
