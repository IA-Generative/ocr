  serviceAccount:
    # -- Enable the service account.
    # @section -- Frontend
    enabled: false
    # -- Create a service account.
    # @section -- Frontend
    create: false
    # -- Annotations applied to created service account.
    # @section -- Frontend
    annotations: {}
    # -- Service account name.
    # @section -- Frontend
    name: ""
    # -- Should the service account access token be automount in the pod.
    # @section -- Frontend
    automountServiceAccountToken: false
    role:
      # -- Should the role be created.
      # @section -- Frontend
      create: false
      # -- Role rules associated with the service account.
      # @section -- Frontend
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Frontend
      create: false
