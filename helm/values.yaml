  # tls:
  # - secretName: domain.local-tls
  #   hosts:
  #   - domain.local
  # -- Globally shared httproute configuration.
  # @section -- Global
  httpRoute: {}
  # enabled: false
  # annotations: {}
  # labels: {}
  # parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-namespace
  #   sectionName: https
  # hostnames: []
  # - "example.com"
  # - "*.example.com"
  # rules: []
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: "/"
  #     headers:
  #     - type: Exact
  #       name: "x-version"
