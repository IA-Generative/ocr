  #   - "bar.remote"
  # -- List of volumes to add.
  # @section -- Worker
  volumes:
  - name: celeryconfig
    configMap:
      name: '{{ printf "%s-%s" (include "helper.fullname" .) "worker-celery" }}'
  - name: cache
    emptyDir: {}
  - name: tmp
    emptyDir: {}
  # `readOnlyRootFilesystem` is enabled on this container (see `securityContext` below); this
  # extra volume defensively covers libraries/tools that write to the system `/tmp` directly
  # instead of the app-specific `.cache`/`.tmp` directories above.
  - name: run-tmp
    emptyDir: {}
  # - name: config-volume
  #   configMap:
  #     name: log-config
  #     items:
  #       - key: log_level
