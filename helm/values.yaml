  # -- Additional volumes to add, concatenated with `volumes` above at render time.
  # @section -- Worker
  extraVolumes: []
  # -- List of volumeClaims to add.
  # @section -- Worker
  volumeClaims: []
  # - metadata:
  #     name: app-volume
  #   spec:
  #     accessModes: [ "ReadWriteOnce" ]
