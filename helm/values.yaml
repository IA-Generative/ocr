    nodePort: 31000
    # -- Port name used by the service.
    # @section -- Worker
    portName: "http"
    # -- Protocol used by the service.
    # @section -- Worker
    protocol: "TCP"
    # -- Extra service ports.
    # @section -- Worker
    extraPorts: []
    # - port: 9090
    #   targetPort: 9090
    #   protocol: "TCP"
    #   name: "metrics"
  resources:
    requests:
      # -- Memory request for the app.
      # @section -- Worker
      memory: "4Gi"
      # -- CPU request for the app.
      # @section -- Worker
      cpu: "2"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "100Mi"
    limits:
      # -- Memory limit for the app.
      # @section -- Worker
      memory: "4Gi"
      # -- CPU limit for the app.
      # @section -- Worker
      cpu: "2"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "500Mi"
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler for the app.
    # @section -- Worker
    enabled: false
    # -- Minimum number of replicas for the app.
    # @section -- Worker
    minReplicas: 1
    # -- Maximum number of replicas for the app.
    # @section -- Worker
    maxReplicas: 3
    # -- Average CPU utilization percentage for the app.
    # @section -- Worker
    targetCPUUtilizationPercentage: 80
    # -- Average memory utilization percentage for the app.
    # @section -- Worker
    targetMemoryUtilizationPercentage: 80
  # -- Revision history limit for the app.
  # @section -- Worker
  revisionHistoryLimit: 10
  # -- Default node selector for app.
  # @section -- Worker
  nodeSelector: {}
  # kubernetes.io/os: "linux"
  # kubernetes.io/arch: "amd64"
  # kubernetes.io/hostname: "node1"
  # -- Default tolerations for app.
  # @section -- Worker
  tolerations: []
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  #   tolerationSeconds: 3600
  # - key: "key2"
  #   operator: "Equal"
  #   value: "value2"
  #   effect: "NoExecute"
  #   tolerationSeconds: 3600
  # - key: "key3"
  #   operator: "Exists"
  #   effect: "PreferNoSchedule"
  #   tolerationSeconds: 3600
  # -- Affinity used for app pod.
  # @section -- Worker
  affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions:
  #       - key: "app.kubernetes.io/name"
