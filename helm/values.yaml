jobs:
  migration:
    hook:
      # -- Enable the Helm hook for this job.
      # @section -- Jobs
      enabled: true
      # -- Hook events to trigger this job. `post-install` and `post-upgrade` are the most common.
      # @section -- Jobs
      types:
      - "post-install"
      - "post-upgrade"
      # -- Hook weight to control the order of execution when multiple hooks are defined. Lower weights execute first.
      # @section -- Jobs
      weight: 1
      # -- Hook delete policy to control when the job is deleted. `before-hook-creation` and `hook-succeeded` are common choices.
      # @section -- Jobs
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      # -- Registry to use for the migration job.
      # @section -- Jobs
      registry: "ghcr.io"
      # -- Repository to use for the migration job.
      # @section -- Jobs
      repository: "ia-generative/ocr/migration"
      # -- Image pull policy for the migration job.
      # @section -- Jobs
      pullPolicy: "IfNotPresent"
      # -- Tag to use for the migration job.
      # Overrides the image tag whose default is the chart appVersion.
      # @section -- Jobs
      tag: ""
    # -- Image credentials configuration.
    # @section -- Jobs
    imagePullSecrets: []
    # - name: "pullsecret-name-1"
    #   create: false
    serviceAccount:
      enabled: false
      create: false
      name: ""
      annotations: {}
      automountServiceAccountToken: false
    podAnnotations: {}
    podLabels: {}
    # -- Pod-level security context. Rendered via `toYaml`, so any other `PodSecurityContext`
    # field (e.g. `runAsGroup`, `sysctls`, `supplementalGroups`) can be added here too, even
    # though not pre-populated below.
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 10001
      seccompProfile:
        type: "RuntimeDefault"
    # -- Container-level security context. Rendered via `toYaml`, so any other
    # `SecurityContext` field (e.g. `runAsGroup`, `procMount`) can be added here too, even though
    # not pre-populated below.
    securityContext:
      runAsUser: 10001
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      seccompProfile:
        type: "RuntimeDefault"
      readOnlyRootFilesystem: true
    initContainers:
    -  # -- Init container to wait for the bundled `postgres` (default database backend) to accept connections. Update/remove this (e.g. to target CNPG's own service instead) when switching `cnpg.enabled: true` for production.
      # @section -- Jobs
      name: wait-for-postgres
      # -- Init container image to use for the wait-for-postgres init container.
      # @section -- Jobs
      image: docker.io/busybox:1.37
      # -- Init container image pull policy for the wait-for-postgres init container.
      # @section -- Jobs
      imagePullPolicy: "IfNotPresent"
      # -- Init container command to wait for the bundled `postgres` (default database backend) to accept connections. Update/remove this (e.g. to target CNPG's own service instead) when switching `cnpg.enabled: true` for production.
      # @section -- Jobs
      command: ["sh", "-c", "until nc -z ocr-postgres 5432; do echo 'Waiting for PostgreSQL...'; sleep 2; done"]
      # -- Init container-level security context for the wait-for-postgres init container. Rendered via `toYaml`, so any other `SecurityContext` field (e.g. `runAsGroup`, `procMount`) can be added here too, even though not pre-populated below.
      # @section -- Jobs
      securityContext:
        runAsUser: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: "RuntimeDefault"
      resources:
        requests:
          # -- CPU request for the wait-for-postgres init container.
          # @section -- Jobs
          cpu: "10m"
          # -- Memory request for the wait-for-postgres init container.
          # @section -- Jobs
          memory: "16Mi"
        limits:
          # -- CPU limit for the wait-for-postgres init container.
          # @section -- Jobs
          cpu: "50m"
          # -- Memory limit for the wait-for-postgres init container.
          # @section -- Jobs
          memory: "32Mi"
    # -- Additional containers to run with the migration container.
    # @section -- Jobs
    extraContainers: []
    # -- Migration container command.
    # @section -- Jobs
    command:
    - "/bin/sh"
    - "-c"
    # -- Migration container command args. Defaults to running Alembic migrations up to the
    # latest revision; override to run a different Alembic command (e.g. stamp then upgrade).
    # @section -- Jobs
    args:
    - "alembic upgrade head"
    # -- Migration container env variables loaded from configmap or secret reference. List or map
    # (merged with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
    # @section -- Jobs
    envFrom: []
    # -- Points at the top-level `postgres` values (the bundled, default database backend).
    # Switching to `cnpg.enabled: true` for production requires overriding (or unsetting, e.g.
    # `null`) this to point at CNPG's own credentials/secret instead - see `postgres`/`cnpg`.
    # @section -- Jobs
    env:
      DATABASE_URL:
        valueFrom:
          secretKeyRef:
            name: "ocr-postgres"
            key: "uri"
    envCm: {}
    # -- Map of environment variables to inject into a secret loaded by the migration container (`valueFrom` not supported).
    # @section -- Jobs
    envSecret: {}
    resources:
      requests:
        # -- Memory request for the migration job.
        # @section -- Jobs
        memory: "64Mi"
        # -- CPU request for the migration job.
        # @section -- Jobs
        cpu: "10m"
      limits:
        # -- Memory limit for the migration job.
        # @section -- Jobs
        memory: "128Mi"
        # -- CPU limit for the migration job.
        # @section -- Jobs
        cpu: "20m"
    # -- List of volumes to add to the migration job.
    # @section -- Jobs
    volumes: []
    # -- List of extra volumes to add to the migration job.
    # @section -- Jobs
    extraVolumes: []
    # -- List of volume mounts to add to the migration job.
    # @section -- Jobs
    volumeMounts: []
    # -- List of extra volume mounts to add to the migration job.
    # @section -- Jobs
    extraVolumeMounts: []
    # -- List of host aliases to add to the migration job.
    # @section -- Jobs
    hostAliases: []
    # -- Default node selector for the migration job.
    # @section -- Jobs
    nodeSelector: {}
    # -- Default affinity for the migration job.
    # @section -- Jobs
    affinity: {}
    # -- Default tolerations for the migration job.
    # @section -- Jobs
    tolerations: []
    # -- Number of retries before considering the Job as failed.
    # @section -- Jobs
    backoffLimit: 10
    # -- Time to live (in seconds) after the Job finishes before it is garbage collected.
    # @section -- Jobs
    ttlSecondsAfterFinished: 300
    # -- Active deadline (in seconds) for the Job. If specified, the job will be terminated if it runs longer than this duration.
    # @section -- Jobs
    activeDeadlineSeconds: null
    # -- Number of successful completions required for the Job to be considered complete. If specified, the job will be considered complete when this many successful completions are reached.
    # @section -- Jobs
    completions: null
    # -- Number of pods to run in parallel for the Job. If specified, the job will run this many pods in parallel.
    # @section -- Jobs
    parallelism: 1
    # -- Restart policy for the Job's pods. Can be `Always`, `OnFailure`, or `Never`.
    # @section -- Jobs
    restartPolicy: "Never"

# -- Map of CronJobs to create. Each key is used as the cronjob name and as its
# `app.kubernetes.io/component` label. Empty by default.
# @section -- Jobs
cronjobs: {}
# archive:
#   schedule: "0 2 * * *"
#   concurrencyPolicy: "Forbid"
#   image:
#     registry: "ghcr.io"
#     repository: "ia-generative/ocr/api"
#     pullPolicy: "IfNotPresent"
#     tag: ""
#   podSecurityContext:
