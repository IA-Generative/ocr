          selector: {}
          # prometheus: kube-prometheus
          # -- Prometheus ServiceMonitor scheme.
          # @section -- Api
          scheme: ""
          # -- Prometheus ServiceMonitor tlsConfig.
          # @section -- Api
          tlsConfig: {}

frontend:
  # -- Workload kind to deploy the app as. One of "Deployment" or "StatefulSet".
  # @section -- Frontend
  deploymentType: "Deployment"
  # -- The number of application controller pods to run.
  # @section -- Frontend
  replicaCount: 1
  image:
    # -- Registry to use for the app.
    # @section -- Frontend
    registry: "ghcr.io"
    # -- Repository to use for the app.
    # @section -- Frontend
    repository: "ia-generative/ocr/frontend"
    # -- Image pull policy for the app.
    # @section -- Frontend
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Frontend
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Frontend
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Frontend
    className: ""
    # -- Additional ingress annotations.
    # @section -- Frontend
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Frontend
    labels: {}
    hosts:
    -  # -- Name of the host record.
      # @section -- Frontend
      name: "domain.local"
      paths:
      -  # -- Path of the host record to manage routing.
        # @section -- Frontend
        path: "/"
        # -- Path type of the host record.
        # @section -- Frontend
        pathType: "Prefix"
        backend:
          # -- Name of the backend service linked to the path (leave empty to use the app service).
          # @section -- Frontend
          serviceName: ""
          # -- Port used by the backend service linked to the path (leave null to use the app service port).
          # @section -- Frontend
          portNumber: null
    # -- Enable TLS configuration.
    # @section -- Frontend
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Gateway API HTTPRoute configuration (alternative to Ingress)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
  httpRoute:
    # -- Enable an HTTPRoute resource for this service.
    # @section -- Frontend
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Frontend
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Frontend
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Frontend
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace  # optional
    #   sectionName: https            # optional, specific listener name
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Frontend
    hostnames: []
    # - "example.com"
    # - "api.example.com"
    # -- Routing rules for the HTTPRoute.
    # @section -- Frontend
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix     # PathPrefix, Exact, or RegularExpression
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service       # defaults to chart service if not set
    #     port: 80               # defaults to service port if not set
    #     weight: 100            # for traffic splitting
  ## Gateway API GRPCRoute configuration (for gRPC services)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
  grpcRoute:
    # -- Enable a GRPCRoute resource for this service.
    # @section -- Frontend
    enabled: false
    # -- Additional GRPCRoute annotations.
    # @section -- Frontend
    annotations: {}
    # -- Additional GRPCRoute labels.
    # @section -- Frontend
    labels: {}
    # -- Parent references (Gateways) to attach the GRPCRoute to.
    # @section -- Frontend
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: grpc
    # -- Hostnames for the GRPCRoute to match.
    # @section -- Frontend
    hostnames: []
    # - "grpc.example.com"
    # -- Routing rules for the GRPCRoute.
    # @section -- Frontend
    rules: []
    # - matches:
    #   - method:
    #       type: Exact          # Exact or RegularExpression
    #       service: "mypackage.MyService"
    #       method: "MyMethod"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #   backendRefs:
    #   - name: my-grpc-service
    #     port: 50051
    #     weight: 100
  # -- Annotations for the app deployed pods.
  # @section -- Frontend
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Frontend
  podLabels: {}
  # -- Pod-level security context. Rendered via `toYaml`, so any other `PodSecurityContext` field
  # (e.g. `runAsGroup`, `sysctls`, `supplementalGroups`) can be added here too, even though not
  # pre-populated below.
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"
  # -- Init containers to add to the app pod.
  # @section -- Frontend
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Frontend
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Frontend container port number.
  # @section -- Frontend
  containerPort: &frontendContainerPort 8080
  # -- Frontend container port name.
  # @section -- Frontend
  containerPortName: "http"
  # -- Frontend extra container ports.
  # @section -- Frontend
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Frontend container command.
  # @section -- Frontend
  command: []
  # -- Frontend container command args.
  # @section -- Frontend
  args: []
  # -- Container-level security context. Rendered via `toYaml`, so any other
  # `SecurityContext` field (e.g. `runAsGroup`, `procMount`) can be added here too, even though
  # not pre-populated below.
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
    # nginx-unprivileged still needs three writable paths under a read-only root: `/run` for its
    # pid file (`pid /run/nginx.pid;` in the image's nginx.conf), `/var/cache/nginx` for request
    # buffering, and `/tmp` for the `*_temp_path` directories its nginx.conf points there
    # (`client_body_temp`, `proxy_temp`, ...). nginx creates those at startup, so missing `/tmp`
    # is not a degraded cache - it is `[emerg] mkdir() "/tmp/proxy_temp" failed` and a container
    # that never serves. All three are provided as `emptyDir`s in
    # `extraVolumes`/`extraVolumeMounts` below - not `volumes`/`volumeMounts`, which real
    # deployments already use for the optional `viteEnv` config.js mount (see mirai-values) and
    # would otherwise silently replace these.
    readOnlyRootFilesystem: true
  # -- Frontend runtime config, rendered as `window.KEY = value` assignments into the
  # `templates/frontend/vite-config.yaml` ConfigMap (mounted as `config.js` - see
  # `volumes`/`volumeMounts` on this component). Since the built frontend bundle is static (Vite
  # env vars are compile-time), this is how truly runtime-configurable values (API URLs, feature
  # flags, ...) reach it without a rebuild.
  # @section -- Frontend
  viteEnv: {}
  # -- Frontend container env variables loaded from configmap or secret reference. List or map
  # (merged with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
  # @section -- Frontend
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Map or array of environment variables to inject into the app container (`valueFrom` supported).
  # @section -- Frontend
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by the app container (`valueFrom` not supported).
  # @section -- Frontend
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by the app container (`valueFrom` not supported).
  # @section -- Frontend
  envSecret: {}
  # E: "E"
  probes:
    startupProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (startupProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 0
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 10
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (readinessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 10
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 2
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 2
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (livenessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 30
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 30
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # @section -- Frontend
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Frontend
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Frontend
      maxSurge: 1
  # -- Image credentials configuration.
  # @section -- Frontend
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  # -- Host aliases that will be injected at pod-level into /etc/hosts.
  # @section -- Frontend
  hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.1.2.3"
  #   hostnames:
  #   - "foo.remote"
  #   - "bar.remote"
  # -- List of volumes to add.
  # @section -- Frontend
  volumes: []
  # - name: config-volume
  #   configMap:
  #     name: log-config
  #     items:
  #       - key: log_level
  #         path: log_level.conf
  # - name: cache-volume
