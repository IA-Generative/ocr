[project]
name = "ocr-api"

version = "0.21.1"

description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-json-logger>=4.2.0",
    "setuptools>=84.0.0",
    "toml>=0.10.2",
    "minio>=7.2.20",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "celery[redis]>=5.6.3",
    "flower>=2.1.0",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.43.78",
    "qdrant-client>=1.19.0",
    "aiofiles>=25.1.0",
    "pymupdf>=1.28.2",
    "cryptography>=50.0.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
stress-test = [
    "locust>=2.46.3",
]

test = [
    "httpx>=0.25.0",
    "pytest-asyncio>=1.4.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
    "pytest-cov>=7.1.0",
    # "celery[pytest]>=5.5.1",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "coverage>=7.15.4",
    "datasets>=5.0.1",
    "pytest-dotenv>=0.5.2",
]
ocr-backend = [
    "httpx>=0.25.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart==0.0.32",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "python-keycloak>=7.1.1",
    "sentry-sdk[fastapi]>=2.68.0",
]

ocr-service-paddle = [
    "liteparse>=2.5.0,!=2.13.0",
    "opencv-python-headless>=5.0.0.93",
    "paddleocr>=3.3.0",
    "paddlepaddle==3.1.1",
    "pdf2image==1.17.0",
    "pillow==12.3.0",
    "psutil>=7.2.2",
    "pynvml>=13.0.1",
]



liteparse = [
    "liteparse>=2.5.0,!=2.13.0",
]

services = [
    "docx2txt>=0.9",
    "langchain-community>=0.4.2",
    "odfpy>=1.4.1",
    "opencv-python-headless>=5.0.0.93",
    "pdf2image==1.17.0",
    "pillow>=12.3.0",
    "psutil>=7.0.0",
    "pynvml>=13.0.1",
    "pypandoc-binary>=1.17",
    "unstructured>=0.27.1",
    "sentry-sdk[celery]>=2.34.1",
    "pypdf>=6.15.0"
]

langfuse = [
    "langfuse>=4.12.0",
]

migration = [
    "alembic>=1.19.1"
]

dev = [
    "httpx>=0.25.0",
    "pytest-asyncio>=1.4.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
    "pytest-cov>=7.1.0",
    # "celery[pytest]>=5.5.1",
    "pillow>=12.3.0",
    "requests>=2.32.3",
    "coverage>=7.8.0",
    "datasets>=5.0.0",
    "pytest-dotenv>=0.5.2",
]

version = [
    "commitizen>=4.18.0",
]
client = [
    "python-magic>=0.4.27",
]
checkbox_service = [
    "boxdetect>=1.0.2",
]
business-forms = [
    "pillow>=12.3.0",
    "pydantic>=2.11.7",
    "pymupdf>=1.26.3",
]
ocr-service-features = [
    "efficientnet-pytorch>=0.7.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1; sys_platform != 'darwin'",
    # GHSA-xrqw-3rrv-vx5w: fixed in 5.10.0, so the previous <5.9.0 cap pinned
    # this platform to a known-vulnerable version. No recorded reason for the
    # upper bound (dev-only, macOS never ships in a container) - dropped rather
    # than picked a new one blind.
    "transformers>=5.10.0; sys_platform == 'darwin'",
]
ocr-docling = [
    "docling>=2.121.0",
]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true



[tool.pytest.ini_options]
env_override_existing_values = 1
env_files = ["tests/.env.testing"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
