services:
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    env_file:
      - .env

  # flower_ocr:
  #   image: ocr-flower
  #   environment:
  #     CELERY_BROKER_URL: redis://redis
  #     CELERY_RESULT_BACKEND: db+postgres://db:secret@db:5432/example_db
  #   ports:
  #     - "5555:5555"
  #   command: ["celery", "--broker=$BROKER_URL" , "flower", "--address=0.0.0.0", "--port=5555"]
  #   env_file:
  #     - .env
  #   build:
  #     context: .
  #     dockerfile: apps/server/flower/Dockerfile

  ocr_service:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: 2.0
          memory: 4000M
        reservations:
          cpus: 2.0
          memory: 4000M
    container_name: ocr-service
    command:
      - "celery"
      - "-A"
      - "services.main"
      - "worker"
      - "--pool=solo"
      - "--loglevel=info"
      - "--concurrency=1"
      - "-E"
      - "--hostname=paddle_worker@%h"
    image: ocr-worker
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
      - ./apps/server/services/:/app/services/
      - ./apps/server/business/:/app/business/
    build:
      context: .
      dockerfile: apps/server/business/paddleocr2/Dockerfile
      # Uncomment to build a GPU-enabled image; also set DEVICE=gpu below and give the
      # container GPU access (e.g. `runtime: nvidia` / `deploy.resources.reservations.devices`).
      # args:
      #   PADDLE_DEVICE: gpu
    depends_on:
      - redis
      - rustfs
      # - migration
      - db
    environment:
      - PROCESS_NAME=paddleocr-2.10.0
      - WORKER_NAME=worker.tasks.ocr
      - CELERY_APP_NAME=default
      - SERVICE_NAME=ocr_worker
      - ENVIRONMENT=development
      # - DEVICE=gpu # requires the image above to be built with PADDLE_DEVICE=gpu
    env_file:
      - .env

  ocr_backend:
    image: ocr-api
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
    ports:
      - 5000:5000
    container_name: ocr-api
    volumes:
      - ./apps/server/ocr_backend/:/app/ocr_backend/
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
    environment:
      - DEV_MODE="true"
      - PROCESS_NAME=paddleocr-2.10.0
      - WORKER_NAME=worker.tasks.ocr
      - CELERY_APP_NAME=default
      - SERVICE_NAME=ocr_api
      - ENVIRONMENT=development
    depends_on:
      - redis
      - db
      - rustfs
      - keycloak
      # - migration

    env_file:
      - .env

  # Runs the periodic purge (old tasks + their S3 files, see apps/server/ocr_backend/purge.py)
  # as a single Celery Beat scheduler + worker process. Embedded beat (--beat) keeps this to one
  # container; only run one replica, otherwise the purge would be scheduled multiple times.
  beat:
    image: ocr-api
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
    container_name: ocr-beat
    command:
      - "celery"
      - "-A"
      - "ocr_backend.celery_beat:celery_app"
      - "worker"
      - "--beat"
      - "--pool=solo"
      - "--loglevel=info"
      - "--concurrency=1"
      - "--hostname=purge_beat@%h"
    volumes:
      - ./apps/server/ocr_backend/:/app/ocr_backend/
      - ./apps/server/src/:/app/src/
    environment:
      - CELERY_APP_NAME=default
      - SERVICE_NAME=ocr_beat
      - ENVIRONMENT=development
    depends_on:
      - redis
      - db
      - rustfs
    env_file:
      - .env

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    # Auto-provisions the "mirai" realm/client/test user below on every start, so local
    # login works out of the box without any manual admin-console setup.
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      # Without a fixed hostname, Keycloak derives the token `iss` from whichever Host
      # header reached it - the browser hits it as `localhost:8080`, but `ocr_backend`
      # hits it as `keycloak:8080`. That mismatch makes Keycloak itself reject any
      # backend call carrying a token minted during the browser's `/auth` request
      # (token exchange, refresh, logout: "Invalid token issuer"). Pinning the hostname
      # makes Keycloak report the same issuer everywhere, regardless of which internal
      # path reached it - the backend still physically connects via `keycloak:8080`.
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8080
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./docker/keycloak/realm-mirai.json:/opt/keycloak/data/import/realm-mirai.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # KC_HEALTH_ENABLED serves /health on the management port (9000), not 8080.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ocr_frontend:
    container_name: ocr_frontend
    restart: unless-stopped
    working_dir: /app
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    ports:
      - 8081:3000
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    depends_on:
      - ocr_backend

  migration:
    image: ocr-migration
    command:
      - alembic
      - upgrade
      - head
    build:
      context: .
      dockerfile: apps/server/migration/Dockerfile
    container_name: ocr-migration
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/migration/:/app/migration
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: example_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  rustfs_data:
    driver: local

  postgres_data:
    driver: local
