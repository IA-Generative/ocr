name: Lint

# Kept local rather than delegated to fabnum-cicd: the shared catalogue has no
# Python linter, and this one is a thin wrapper around the repository's own
# `make lint` (ruff for apps/server, ESLint for apps/client and the root files).

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run the linter
        required: false
        type: string
        default: "3.13"
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "24"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run the linter
        required: false
        type: string
        default: "3.13"
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "24"

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        version: "0.13.5"
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: apps/server/uv.lock

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          apps/client/pnpm-lock.yaml

    - name: Install Node dependencies
      # `make lint` shells out to ESLint at the root and in apps/client, which
      # keep separate installs (apps/client is not a pnpm workspace member).
      run: |
        pnpm install --frozen-lockfile
        pnpm --dir apps/client install --frozen-lockfile

    - name: Run lint
      # `make lint` bootstraps uv itself when absent, so it is safe whichever
      # runner this lands on.
      run: make lint
