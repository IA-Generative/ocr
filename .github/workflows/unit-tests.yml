name: Unit Tests

# Kept local rather than delegated to fabnum-cicd: every target here drives
# `docker compose` against postgres/redis/minio through the repository's
# Makefile. `test-docker.yml` runs a command in a single image and cannot
# stand these up.

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.13"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.13"

jobs:
  run-tests-backend:
    name: Backend API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # docker-compose-test.yaml interpolates these into the ocr_backend service; CI has no
    # .env.local supplying real values, so an unset default here just quiets Compose's
    # "variable is not set" warning without changing what the container actually gets.
    env:
      HARBOR_PROXY_URL: ""
      OPENAI_BASE_URL: ""
      VISION_MODEL: ""
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Install dependencies and run tests
      run: make test-backend-api

    - name: Tear down containers
      if: ${{ always() }}
      # `make test-*` already calls `make down-test` on success; this catches
      # the failure path, so a failed run still exits with the compose stack
      # stopped instead of leaking it to the runner's teardown.
      run: make down-test

  run-tests-sdk:
    name: SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Install dependencies and run tests
      run: make test-sdk

    - name: Tear down containers
      if: ${{ always() }}
      run: docker compose -f docker-compose.yaml down -v || true

  run-tests-service-paddle:
    name: PaddleOCR 2.10.0 service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # See run-tests-backend above: same docker-compose-test.yaml, same unset-variable noise.
    env:
      HARBOR_PROXY_URL: ""
      OPENAI_BASE_URL: ""
      VISION_MODEL: ""
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Install dependencies and run tests
      run: make test-services-paddleocr2.10.0

    - name: Tear down containers
      if: ${{ always() }}
      run: make down-test

  # PaddleOCR 3.1.0 (CPU and GPU) targets are commented out in the Makefile;
  # restore the matching jobs here alongside them.
