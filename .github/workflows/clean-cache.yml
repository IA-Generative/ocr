name: Clean GitHub Cache and GHCR Images

# Reconciles Actions caches and ghcr.io images against what actually exists,
# once a day, rather than reacting to a pull request closing.
#
# A `pull_request: closed` trigger races the pull request's own build: the
# sweep would fire while ci.yml is still pushing `pr-<n>`, find nothing to
# delete, exit 0, and let the image land seconds later with nothing left to
# remove it. A green run that did nothing.
#
# Running once the builds have settled cannot lose that race, and collects
# whatever earlier runs left behind. It is idempotent: a second pass over an
# already-clean pull request reports "not found" and exits 0.

on:
  schedule:
  # 01:00 UTC daily, comfortably after the day's builds have settled.
  - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      LOOKBACK_DAYS:
        description: How far back to reconcile closed pull requests (raise it once to absorb a backlog)
        required: false
        type: number
        default: 3

jobs:
  list-closed-prs:
    name: List recently closed pull requests
    runs-on: ubuntu-latest
    # Held here rather than by the reusable workflows, which never learn about
    # pull request state. This job is also what keeps open pull requests out of
    # the sweep: clean-images.yml deletes the tag it is given, whatever its
    # pull request is doing.
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      image-base: ${{ steps.image-base.outputs.IMAGE_BASE }}
    steps:
    - name: Compute image base
      id: image-base
      shell: bash
      # clean-images.yml takes IMAGE as given, and `IA-Generative` is mixed
      # case - OCI registries reject uppercase references.
      run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

    - name: Collect closed pull requests within the lookback window
      id: list
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        # The schedule has no inputs context, so it falls back to the default.
        LOOKBACK_DAYS: ${{ inputs.LOOKBACK_DAYS || 3 }}
      run: |
        set -euo pipefail

        # A daily run only has to cover what closed since the last one; the
        # window is wider than the interval so a missed run still gets swept.
        CUTOFF=$(date -u -d "$LOOKBACK_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
        echo "Reconciling pull requests closed since $CUTOFF"

        PRS=$(gh pr list -R "$REPO" --state closed --limit 100 \
          --json number,headRefName,closedAt \
          | jq -c --arg c "$CUTOFF" \
            '[.[] | select(.closedAt >= $c) | {number, headRefName}]')

        echo "Found $(printf '%s' "$PRS" | jq 'length') pull request(s) to reconcile"
        printf '%s\n' "$PRS" | jq -r '.[] | "  #\(.number) (\(.headRefName))"'
        echo "prs=$PRS" >> "$GITHUB_OUTPUT"

  sweep-caches:
    name: Sweep caches
    needs: list-closed-prs
    # An empty matrix vector is a workflow error, not an empty run.
    if: ${{ needs.list-closed-prs.outputs.prs != '[]' }}
    uses: dnum-mi/fabnum-cicd/.github/workflows/clean-cache.yml@v0
    # Caches only - no access to the container registry.
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list-closed-prs.outputs.prs) }}
    with:
      # Both refs: the pull request's own caches live under
      # refs/pull/<N>/merge, and the branch may hold its own from a
      # push-triggered run.
      PR_NUMBER: ${{ matrix.pr.number }}
      BRANCH_NAME: ${{ matrix.pr.headRefName }}

  sweep-images:
    name: Sweep images
    needs: list-closed-prs
    if: ${{ needs.list-closed-prs.outputs.prs != '[]' }}
    uses: dnum-mi/fabnum-cicd/.github/workflows/clean-images.yml@v0
    # Registry only - no access to the Actions cache.
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list-closed-prs.outputs.prs) }}
        service:
        - api
        - worker
        - migration
        - frontend
    with:
      IMAGE: ${{ needs.list-closed-prs.outputs.image-base }}/${{ matrix.service }}:pr-${{ matrix.pr.number }}

  sweep-orphans:
    name: Sweep orphaned build artifacts
    needs: list-closed-prs
    # Independent of any pull request: this collects versions left carrying
    # only a commit SHA, after a moving tag was reassigned to a newer build.
    # CLEAN_ORPHANED reads only the package name, so IMAGE carries no tag.
    uses: dnum-mi/fabnum-cicd/.github/workflows/clean-images.yml@v0
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
        - api
        - worker
        - migration
        - frontend
    with:
      IMAGE: ${{ needs.list-closed-prs.outputs.image-base }}/${{ matrix.service }}
      CLEAN_TAGGED: false
      CLEAN_ORPHANED: true
      # `dev` is this repository's prerelease branch, alongside the deployment
      # branches the CPiN mirror tags images from.
      PROTECTED_TAGS: latest,main,dev,staging,preprod
