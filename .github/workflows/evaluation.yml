name: Evaluation

# Evaluates the models under evaluation/configs/ (those with `ci: true`) on HuggingFace datasets
# and keeps evaluation/reports/ up to date.
#
#   pull request  -> plans which configs are new or touched by the PR (the first run launches
#                    all of them), evaluates each one in PARALLEL on its own runner, then
#                    pushes the updated reports to the PR branch.
#   main / weekly / manual -> every config; the reports go to a PR (chore/evaluation-reports).
#
# Nothing is written unless an input changed: `ocr-eval` skips any dataset whose fingerprint
# (eval code, model config / weights / library versions, dataset config and revision, hardware
# label) matches the committed report, so an unchanged config costs one runner for a minute and
# produces no commit and no PR.
#
# Non-blocking: jobs are independent (fail-fast off), a slow or failing model does not stop the
# others, and this workflow must NOT be a required status check (a run takes hours). Reports
# are pushed with GITHUB_TOKEN, which by design does not re-trigger workflows.
#
# Kept local rather than delegated to fabnum-cicd: it is specific to this repository.
# Repository setting required: Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests" (for the non-PR flow).

on:
  pull_request:
    paths:
    - 'evaluation/**'
    - '!evaluation/reports/**'
    - '.github/workflows/evaluation.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Re-run every dataset even if nothing changed
        required: false
        type: boolean
        default: false
  schedule:
  # Weekly: catches upstream changes (HF dataset revisions) that no commit announces.
  - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
    - 'evaluation/**'
    - '!evaluation/reports/**'
    - '.github/workflows/evaluation.yml'

concurrency:
  group: evaluation-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR makes the previous run obsolete; scheduled / main runs are never cut.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPORTS_BRANCH: chore/evaluation-reports
  # Reports compare timings, so the runner class is part of the cache fingerprint instead of
  # the CPU model, which differs from one ubuntu-latest VM to the next.
  OCR_EVAL_HARDWARE_LABEL: github-ubuntu-latest
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Reports are committed back to the branch: a fork's token cannot write to it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: evaluation/uv.lock

    - name: Install the planner (no model runtime)
      working-directory: evaluation
      run: uv sync --frozen

    - name: Select the configs to run
      id: plan
      working-directory: evaluation
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$EVENT" = "pull_request" ]; then
          # Only what the PR touches; configs without a report yet are added by the planner.
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | tr '\n' ' ')
          matrix=$(uv run ocr-eval plan --changed $changed)
        else
          matrix=$(uv run ocr-eval plan --all)
        fi
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        if [ "$matrix" = '{"include":[]}' ]; then
          echo "has_work=false" >> "$GITHUB_OUTPUT"
          echo "No config to evaluate."
        else
          echo "has_work=true" >> "$GITHUB_OUTPUT"
          echo "Configs to evaluate: $matrix"
        fi

  evaluate:
    name: Evaluate ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    # Hosted-runner maximum. The 1000 PDF pages per model dominate; a very slow model may need
    # a smaller max_samples or a bigger runner.
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      # One runner per config, all in parallel; one failure never cancels the others.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: evaluation/uv.lock

    - name: Cache model weights and datasets
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cache/huggingface
          ~/.paddlex
        key: evaluation-models-${{ matrix.name }}-${{ hashFiles('evaluation/uv.lock', format('evaluation/{0}', matrix.config)) }}
        restore-keys: evaluation-models-${{ matrix.name }}-

    - name: Install Tesseract (binary and French data)
      if: matrix.extra == 'tesseract'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra

    - name: Install dependencies
      working-directory: evaluation
      env:
        EXTRA: ${{ matrix.extra }}
      run: uv sync --frozen ${EXTRA:+--extra $EXTRA}

    - name: Run evaluation
      id: eval
      working-directory: evaluation
      env:
        FORCE: ${{ inputs.force && '--force' || '' }}
      run: |
        # Exit 2 = a threshold failed: the reports are still published, and the job is failed
        # afterwards. Anything else non-zero is a crash.
        set +e
        uv run ocr-eval run "${{ matrix.config }}" --output-dir reports $FORCE
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

    - name: Upload reports
      # Also after a crash: datasets finished before it are still worth keeping.
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: reports-${{ matrix.name }}
        # Includes the gitignored samples.jsonl (per-sample details), kept as an artifact only.
        path: evaluation/reports/${{ matrix.name }}
        retention-days: 30
        if-no-files-found: ignore

    - name: Fail if a threshold was violated
      if: steps.eval.outputs.exit_code == '2'
      run: |
        echo "::error::At least one dataset of ${{ matrix.name }} is below its threshold."
        exit 1

  publish:
    name: Publish reports
    needs: [plan, evaluate]
    # Runs once every model finished, even if some failed: their reports are still proposed.
    if: ${{ !cancelled() && needs.plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        # On a PR, work on its branch (not the merge commit) so the reports can be pushed to it.
        ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}

    - name: Download reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: reports-*
        path: downloaded

    - name: Put the reports in place
      run: |
        # downloaded/reports-<name>/ holds the contents of evaluation/reports/<name>/.
        # The model's folder is replaced as a whole, so datasets dropped from a config vanish.
        shopt -s nullglob
        for dir in downloaded/reports-*; do
          name=${dir#downloaded/reports-}
          rm -rf "evaluation/reports/$name"
          mkdir -p "evaluation/reports/$name"
          cp -r "$dir"/. "evaluation/reports/$name/"
        done

    - name: Check whether the reports changed
      id: changes
      run: |
        # samples.jsonl is gitignored, so only the versioned reports count.
        if [ -n "$(git status --porcelain -- evaluation/reports)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --short -- evaluation/reports
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Reports unchanged, nothing to publish."
        fi

    - name: Commit the reports to the pull request branch
      if: steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request'
      env:
        BRANCH: ${{ github.head_ref }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add evaluation/reports
        git commit -m "chore(evaluation): update evaluation reports"
        # The branch may have moved while the evaluation ran.
        git pull --rebase origin "$BRANCH"
        git push origin "HEAD:$BRANCH" || echo "::warning::Could not push the reports (branch merged or deleted?)"

    - name: Open or update the reports PR
      if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$REPORTS_BRANCH"
        git add evaluation/reports
        git commit -m "chore(evaluation): update evaluation reports"
        # One long-lived branch: a new run updates the open PR instead of stacking new ones.
        git push --force origin "$REPORTS_BRANCH"
        if [ -z "$(gh pr list --head "$REPORTS_BRANCH" --state open --json number --jq '.[].number')" ]; then
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$REPORTS_BRANCH" \
            --title "chore(evaluation): update evaluation reports" \
            --body "Updated by the Evaluation workflow because at least one input changed (dataset, sample count, model parameters or weights, library versions, evaluation code or dataset revision). See the README.md of each dataset under \`evaluation/reports/\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
