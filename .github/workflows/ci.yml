name: CI

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    branches:
    - "**"
  workflow_dispatch:

# Only the newest push to a pull request is worth building; cancel superseded
# runs rather than paying for images nobody will look at. Safe to cancel here,
# unlike the release pipeline, because nothing is published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  BUILD_AMD64: true
  BUILD_ARM64: false
  LATEST_TAG: false
  # Only amd64 is built, and the runners are amd64 - emulation would just make
  # the paddle layers slower for nothing.
  USE_QEMU: false
  # A pull request's IMAGE_TAG (pr-<N>) stays constant across every push, so a
  # commit that leaves this image's content unchanged reuses the previous
  # digest - the short-sha tag would then just pile another tag onto that same
  # still-live version instead of marking anything new. Nothing here reads a
  # PR build by its commit SHA, so there is nothing worth tagging it with.
  TAG_SHORT_SHA: false
  CT_CONF_PATH: ci/configs/ct.yaml

jobs:
  path-filter:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      sdk: ${{ steps.filter.outputs.sdk }}
      helm: ${{ steps.filter.outputs.helm }}
      ci: ${{ steps.filter.outputs.ci }}
      services: ${{ steps.services.outputs.services }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - name: Check updated files paths
      uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
      id: filter
      with:
        filters: |
          server:
            - 'apps/server/**'
            - 'alembic.ini'
            - 'Makefile'
          client:
            - 'apps/client/**'
          sdk:
            - 'sdk/**'
          helm:
            - 'helm/**'
            - 'ci/configs/ct.yaml'
          ci:
            - '.github/workflows/**'

    - name: Select images to build
      id: services
      # The worker image installs PaddleOCR and its CUDA-adjacent wheels; it is
      # by far the most expensive thing this pipeline can do. Building it on a
      # frontend-only pull request costs tens of minutes and proves nothing, so
      # the matrix is computed from the paths that actually feed each image
      # rather than being a fixed list gated by one shared `if`.
      #
      # A workflow change rebuilds everything: it can change how any image is
      # produced.
      env:
        SERVER: ${{ steps.filter.outputs.server }}
        CLIENT: ${{ steps.filter.outputs.client }}
        CI: ${{ steps.filter.outputs.ci }}
      run: |
        set -euo pipefail

        SERVICES='[]'
        add() { SERVICES=$(jq -c --argjson s "$1" '. + [$s]' <<<"$SERVICES"); }

        if [ "$SERVER" = "true" ] || [ "$CI" = "true" ]; then
          # The server images build from the repository root: their
          # Dockerfiles copy apps/server/** plus the root alembic.ini. The api
          # and worker images must name their target - the last stage of their
          # Dockerfiles is `test`, so an untargeted build would publish the test
          # image. The migration Dockerfile has a single stage.
          add '{"name":"api","context":".","dockerfile":"apps/server/ocr_backend/Dockerfile","target":"builder"}'
          add '{"name":"worker","context":".","dockerfile":"apps/server/business/paddleocr2/Dockerfile","target":"builder"}'
          add '{"name":"migration","context":".","dockerfile":"apps/server/migration/Dockerfile","target":""}'
        fi
        if [ "$CLIENT" = "true" ] || [ "$CI" = "true" ]; then
          add '{"name":"frontend","context":"apps/client","dockerfile":"apps/client/Dockerfile","target":"prod"}'
        fi

        echo "Images to build: $SERVICES"
        echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  expose-vars:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions: {}
    outputs:
      PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
      BUILD_AMD64: ${{ env.BUILD_AMD64 }}
      BUILD_ARM64: ${{ env.BUILD_ARM64 }}
      LATEST_TAG: ${{ env.LATEST_TAG }}
      USE_QEMU: ${{ env.USE_QEMU }}
      TAG_SHORT_SHA: ${{ env.TAG_SHORT_SHA }}
      CT_CONF_PATH: ${{ env.CT_CONF_PATH }}
      IMAGE_BASE: ${{ steps.image.outputs.IMAGE_BASE }}
      IMAGE_TAG: ${{ steps.image.outputs.IMAGE_TAG }}
    steps:
    - name: Exposing env vars
      run: echo "Exposing env vars"

    - name: Compute image base and tag
      id: image
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
      run: |
        set -euo pipefail

        # `IA-Generative` is mixed case and OCI registries reject uppercase
        # references. build-docker.yml normalizes its own IMAGE_NAME, but
        # scan-trivy.yml and clean-images.yml take the string as given - so the
        # lowercase form is computed once here and shared by every consumer.
        echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

        # IMAGE_TAG is a required input of build-docker.yml. A pull request
        # names it after its number; a manual dispatch has no pull request, so
        # it falls back to the branch - lowercased, and with the '/' of names
        # like 'feat/foo' replaced, neither of which is legal in a tag.
        if [ -n "$PR_NUMBER" ]; then
          IMAGE_TAG="pr-$PR_NUMBER"
        else
          IMAGE_TAG=$(printf '%s' "${GITHUB_REF_NAME,,}" | tr -c 'a-z0-9._-' '-')
        fi
        echo "Image tag: $IMAGE_TAG"
        echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  lint-commits:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-commits.yml@v0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: read
      contents: read
    with:
      # Without this, the reusable workflow ignores the repository's own config and
      # generates an equivalent-but-separate one from its own input defaults - harmless
      # today since both resolve to the same rules, but a future edit to this file would
      # silently stop affecting CI.
      CONFIG_FILE: commitlint.config.js

  lint-python:
    uses: ./.github/workflows/lint.yml
    needs:
    - path-filter
    - expose-vars
    if: ${{ needs.path-filter.outputs.server == 'true' || needs.path-filter.outputs.sdk == 'true' || needs.path-filter.outputs.ci == 'true' }}
    permissions:
      contents: read
    with:
      PYTHON_VERSION: ${{ needs.expose-vars.outputs.PYTHON_VERSION }}

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    needs:
    - path-filter
    - expose-vars
    if: ${{ needs.path-filter.outputs.server == 'true' || needs.path-filter.outputs.sdk == 'true' || needs.path-filter.outputs.ci == 'true' }}
    permissions:
      contents: read
    with:
      PYTHON_VERSION: ${{ needs.expose-vars.outputs.PYTHON_VERSION }}

  scan-gitleaks:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-gitleaks.yml@v0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      # Requested by the scan job itself even with GITHUB_SECURITY_TAB off; a
      # caller granting less fails the run before it starts.
      security-events: write
      pull-requests: write
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
      GITHUB_SECURITY_TAB: true

  scan-trivy-conf:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs:
    - expose-vars
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    with:
      PATH: ./
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
      # sarif, not the table default: only sarif uploads to the Security tab below.
      # The human-readable table moves from the job summary to that dashboard instead.
      FORMAT: sarif
      GITHUB_SECURITY_TAB: true
      CATEGORY: trivy-config
      TRIVYIGNORES: .trivyignore.yaml

  build-docker:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
    - path-filter
    - expose-vars
    # An empty matrix vector is a workflow error, not an empty run.
    if: ${{ needs.path-filter.outputs.services != '[]' }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.path-filter.outputs.services) }}
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/${{ matrix.service.name }}
      IMAGE_TAG: ${{ needs.expose-vars.outputs.IMAGE_TAG }}
      IMAGE_CONTEXT: ${{ matrix.service.context }}
      IMAGE_DOCKERFILE: ${{ matrix.service.dockerfile }}
      IMAGE_TARGET: ${{ matrix.service.target }}
      BUILD_AMD64: ${{ needs.expose-vars.outputs.BUILD_AMD64 == 'true' }}
      BUILD_ARM64: ${{ needs.expose-vars.outputs.BUILD_ARM64 == 'true' }}
      LATEST_TAG: ${{ needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      TAG_SHORT_SHA: ${{ needs.expose-vars.outputs.TAG_SHORT_SHA == 'true' }}
      CACHE: true
      # 'max' would export every intermediate layer of three images, and the
      # paddle stages alone overrun the repository's 10 GB cache budget - past
      # which GitHub evicts entries and builds import a manifest that hits
      # nothing. 'min' keeps a smaller cache that actually survives.
      CACHE_MODE: min
      BUILD_ARGS: |
        APP_VERSION=${{ needs.expose-vars.outputs.IMAGE_TAG }}
    # No `secrets:` block: pushing to ghcr.io authenticates with the job's own
    # GITHUB_TOKEN, and BUILD_SECRET_GITHUB_TOKEN is left at its 'none' default,
    # so nothing here needs a credential. `secrets: inherit` would hand this
    # workflow every secret in the repository - OPENAI_API_KEY,
    # GITLAB_TRIGGER_TOKEN - to build a container that uses none of them.

  scan-trivy-images:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs:
    - path-filter
    - expose-vars
    - build-docker
    if: ${{ needs.path-filter.outputs.services != '[]' }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.path-filter.outputs.services) }}
    with:
      IMAGE: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/${{ matrix.service.name }}:${{ needs.expose-vars.outputs.IMAGE_TAG }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
      # sarif, not the table default: only sarif uploads to the Security tab below.
      # The human-readable table moves from the job summary to that dashboard instead.
      FORMAT: sarif
      GITHUB_SECURITY_TAB: true
      # One matrix leg per service, all uploading from the same repository - a
      # shared category would let each upload replace the previous one, leaving
      # only whichever image finished last.
      CATEGORY: trivy-image-${{ matrix.service.name }}
      # The worker image carries the whole paddle/torch wheel set; Trivy's 5m
      # default expires while it is still unpacking a single large binary, and
      # that failure is total - the scan aborts and writes no report at all.
      TIMEOUT: 20m

  lint-helm-docs:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-helm.yml@v0
    needs:
    - path-filter
    - expose-vars
    if: ${{ needs.path-filter.outputs.helm == 'true' || needs.path-filter.outputs.ci == 'true' }}
    permissions:
      contents: read
    with:
      HELM_DOCS_VERSION: v1.14.2
      CT_CONF_PATH: ${{ needs.expose-vars.outputs.CT_CONF_PATH }}
      CHARTS_DIR: helm
      LINT_CHARTS: false
      LINT_DOCS: true

  lint-helm-charts:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-helm.yml@v0
    needs:
    - path-filter
    - expose-vars
    if: ${{ needs.path-filter.outputs.helm == 'true' || needs.path-filter.outputs.ci == 'true' }}
    permissions:
      contents: read
    with:
      HELM_DOCS_VERSION: v1.14.2
      CT_CONF_PATH: ${{ needs.expose-vars.outputs.CT_CONF_PATH }}
      CHARTS_DIR: helm
      LINT_CHARTS: true
      LINT_DOCS: false

  # No `test-helm` job on purpose. `ct install` renders the chart with its
  # default values, which point at ghcr.io images tagged with the chart's
  # appVersion, and brings up postgres, redis and rustfs alongside them. On a
  # pull request that tag does not exist yet, and the worker image would not
  # fit a hosted runner's disk regardless. Add it behind a dedicated
  # helm/ci/*-values.yaml pinning small stand-in images if the install
  # path is worth covering.

  # Workaround for required status check in protection branches (see. https://github.com/orgs/community/discussions/13690)
  all-jobs-passed:
    name: Check jobs status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    # Every job in this workflow must be listed here, or a failure in the
    # missing one leaves the gate green and the branch mergeable.
    needs:
    - path-filter
    - expose-vars
    - lint-commits
    - lint-python
    - unit-tests
    - scan-gitleaks
    - scan-trivy-conf
    - build-docker
    - scan-trivy-images
    - lint-helm-docs
    - lint-helm-charts
    steps:
    - name: Check status of all required jobs
      run: |-
        NEEDS_CONTEXT='${{ toJson(needs) }}'
        JOB_IDS=$(echo "$NEEDS_CONTEXT" | jq -r 'keys[]')
        for JOB_ID in $JOB_IDS; do
          RESULT=$(echo "$NEEDS_CONTEXT" | jq -r ".[\"$JOB_ID\"].result")
          echo "$JOB_ID job result: $RESULT"
          if [[ $RESULT != "success" && $RESULT != "skipped" ]]; then
            echo "***"
            echo "Error: The $JOB_ID job did not pass."
            exit 1
          fi
        done
        echo "All jobs passed or were skipped."
